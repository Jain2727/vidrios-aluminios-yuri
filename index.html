<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vidrios y Aluminios Yuri | Sistema Profesional de Cotizaciones</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Narrow', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #333;
        }

        /* LOGIN */
        #login {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1f4e79 0%, #0d2b45 100%);
            padding: 20px;
        }
        .loginBox {
            background: white;
            padding: 35px;
            width: 420px;
            max-width: 100%;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            text-align: center;
        }
        .loginBox h3 {
            font-family: 'Arial Narrow', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #1f4e79;
            margin-bottom: 10px;
        }
        .loginBox .subtitle {
            font-size: 13px;
            color: #6c8daa;
            margin-bottom: 25px;
        }
        .login-tabs {
            display: flex;
            gap: 5px;
            background: #f0f4f8;
            border-radius: 50px;
            padding: 5px;
            margin-bottom: 25px;
        }
        .login-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: 40px;
            font-family: 'Arial Narrow', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            color: #5a7a9a;
            transition: all 0.3s ease;
        }
        .login-tab.active {
            background: #1f4e79;
            color: white;
        }
        .login-form {
            display: none;
            text-align: left;
        }
        .login-form.active {
            display: block;
        }
        .login-form input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #c0d4e5;
            border-radius: 12px;
            font-family: 'Arial Narrow', sans-serif;
            font-size: 15px;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 70px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #1f4e79;
            font-size: 12px;
            background: none;
            border: none;
            font-family: 'Arial Narrow', sans-serif;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Arial Narrow', sans-serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .btn-login:hover { background: #0d3b5a; transform: translateY(-1px); }
        .btn-verify { background: #28a745; }
        .btn-verify:hover { background: #218838; }
        .code-group { display: none; margin-top: 10px; }
        .error-msg { color: #d32f2f; font-size: 13px; margin-top: 10px; text-align: center; }
        .success-msg { color: #28a745; font-size: 13px; margin-top: 10px; text-align: center; }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #aaa;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }
        .divider span { padding: 0 10px; }

        /* APP */
        #app {
            display: none;
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
        }
        .dashboard-header {
            background: white;
            border-radius: 16px;
            padding: 15px 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .dashboard-header h2 {
            font-family: 'Arial Narrow', sans-serif;
            font-weight: 700;
            color: #1f4e79;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Arial Narrow', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .btn-primary { background: #1f4e79; color: white; }
        .btn-primary:hover { background: #0d3b5a; transform: translateY(-1px); }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-warning:hover { background: #e0a800; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }
        .btn-info { background: #17a2b8; color: white; }
        .btn-info:hover { background: #138496; }

        .workspace {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .quote-area {
            flex: 2.5;
            min-width: 320px;
            max-width: 100%;
            overflow-x: auto;
        }
        .history-area {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            height: fit-content;
            max-height: 80vh;
            overflow-y: auto;
        }
        .history-area h3 {
            font-family: 'Arial Narrow', sans-serif;
            font-weight: 700;
            color: #1f4e79;
            margin-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 8px;
        }
        .history-search {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 15px;
            border: 1px solid #c0d4e5;
            border-radius: 8px;
            font-family: 'Arial Narrow', sans-serif;
        }
        .history-item {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            font-size: 13px;
            border-left: 4px solid #1f4e79;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:hover { background: #e9ecef; transform: translateX(3px); }
        .history-info { flex: 1; }
        .history-actions { display: flex; gap: 8px; }
        .history-actions button {
            padding: 4px 8px;
            font-size: 11px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Arial Narrow', sans-serif;
        }
        .btn-edit { background: #ffc107; color: #333; }
        .btn-delete { background: #dc3545; color: white; }

        /* ESTILOS DE PÁGINA A4 - FIJOS */
        .a4-page {
            background: white;
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto 20px auto;
            padding: 8mm 10mm;
            position: relative;
            font-family: 'Arial Narrow', 'Segoe UI', sans-serif;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            border: 1px solid #e0e8f0;
            page-break-after: always;
            break-after: page;
            box-sizing: border-box;
        }
        
        /* MARCA DE AGUA */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 45px;
            font-family: 'Arial Narrow', sans-serif;
            font-weight: 900;
            color: rgba(31, 78, 121, 0.08);
            pointer-events: none;
            z-index: 0;
            white-space: nowrap;
            letter-spacing: 5px;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
        }
        
        /* ENCABEZADO FIJO - IDÉNTICO EN TODAS LAS PÁGINAS */
        .header-fixed {
            background: white;
            position: relative;
            z-index: 2;
            margin-bottom: 10px;
        }
        
        .header {
            text-align: center;
            position: relative;
            padding-bottom: 10px;
            border-bottom: 2px solid #1f4e79;
            z-index: 2;
            background: white;
        }
        
        .logo {
            position: absolute;
            top: 0;
            width: 80px;
            max-height: 75px;
            object-fit: contain;
            background: transparent;
            z-index: 2;
        }
        .logo-left { left: 0; }
        .logo-right { right: 0; }
        
        .logo-buttons {
            position: absolute;
            top: 75px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }
        .logo-buttons button {
            background: #e8f0f8;
            color: #1f4e79;
            padding: 3px 12px;
            font-size: 10px;
            border: 1px solid #c0d4e5;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Arial Narrow', sans-serif;
            font-weight: bold;
            z-index: 10;
        }
        
        .company-name {
            font-size: 24px;
            font-family: 'Arial Narrow', sans-serif;
            font-weight: 800;
            color: #1f4e79;
            letter-spacing: 1px;
        }
        
        .company-owner {
            font-size: 12px;
            font-weight: bold;
            font-family: 'Arial Narrow', sans-serif;
            color: #2c5a7a;
            margin-top: 2px;
        }
        
        .company-ruc {
            font-weight: bold;
            font-size: 10px;
            font-family: 'Arial Narrow', sans-serif;
            color: #5a6e7a;
            margin: 2px 0;
        }
        
        .direccion {
            font-size: 10px;
            color: #5a6e7a;
            margin-top: 3px;
        }
        .direccion input {
            text-align: center;
            background: transparent;
            border: 1px solid #c0d4e5;
            border-radius: 20px;
            padding: 3px 15px;
            width: 70%;
            font-size: 10px;
            font-family: 'Arial Narrow', sans-serif;
        }
        
        /* DATOS DE COTIZACIÓN */
        .quote-number {
            text-align: center;
            margin: 10px 0;
            padding: 8px;
            background: linear-gradient(135deg, #1f4e79 0%, #0d3b5a 100%);
            border-radius: 8px;
        }
        
        .quote-number label {
            color: white;
            font-size: 14px;
            font-weight: bold;
            font-family: 'Arial Narrow', sans-serif;
            margin-right: 12px;
        }
        
        .quote-number input {
            font-size: 18px;
            font-weight: bold;
            padding: 4px 15px;
            width: auto;
            min-width: 160px;
            text-align: center;
            background: transparent;
            border: 2px solid white;
            border-radius: 6px;
            font-family: 'Arial Narrow', monospace;
            letter-spacing: 1px;
            color: white;
        }
        
        /* FECHAS DERECHA */
        .dates-right {
            text-align: right;
            margin: 10px 0 15px 0;
            padding: 8px 12px;
            background: #f0f7ff;
            border-radius: 8px;
            border: 1px solid #c0d8e8;
        }
        
        .dates-right div {
            margin: 3px 0;
            font-size: 11px;
            font-family: 'Arial Narrow', sans-serif;
            text-align: right;
        }
        
        .dates-right b {
            color: #1f4e79;
            font-weight: 700;
            margin-right: 6px;
        }
        
        .dates-right input, .dates-right select {
            background: white;
            border: 1px solid #c0d4e5;
            border-radius: 12px;
            padding: 3px 8px;
            font-size: 10px;
            font-family: 'Arial Narrow', sans-serif;
            text-align: right;
        }
        
        /* CLIENTE - SOLO PÁGINA 1 */
        .client-card {
            background: #e8f4fd;
            border-radius: 10px;
            padding: 12px 15px;
            margin: 10px 0;
            border: 1px solid #c0d8e8;
            z-index: 2;
            position: relative;
        }
        
        .client-card h4 {
            font-weight: 700;
            color: #1f4e79;
            margin-bottom: 8px;
            border-left: 4px solid #1f4e79;
            padding-left: 10px;
            font-family: 'Arial Narrow', sans-serif;
            font-size: 13px;
        }
        
        .campo {
            display: flex;
            margin-bottom: 6px;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .campo label {
            width: 120px;
            font-weight: 700;
            color: #1f4e79;
            font-size: 10px;
            font-family: 'Arial Narrow', sans-serif;
        }
        
        .campo input {
            flex: 1;
            padding: 4px 10px;
            border: 1px solid #c0d4e5;
            border-radius: 15px;
            font-family: 'Arial Narrow', sans-serif;
            font-size: 10px;
            background: white;
        }
        
        /* TABLA DE ITEMS */
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            z-index: 2;
            position: relative;
            table-layout: fixed;
        }
        
        .items-table th {
            background: #1f4e79;
            color: white;
            padding: 6px 4px;
            font-weight: 700;
            font-size: 9px;
            text-align: center;
            font-family: 'Arial Narrow', sans-serif;
        }
        
        .items-table th:nth-child(1) { width: 6%; }
        .items-table th:nth-child(2) { width: 50%; }
        .items-table th:nth-child(3) { width: 10%; }
        .items-table th:nth-child(4) { width: 12%; }
        .items-table th:nth-child(5) { width: 12%; }
        .items-table th:nth-child(6) { width: 10%; }
        
        .items-table td {
            border: 1px solid #c0d4e5;
            padding: 4px 3px;
            vertical-align: top;
            font-family: 'Arial Narrow', sans-serif;
            font-size: 9px;
        }
        
        .items-table textarea {
            width: 100%;
            border: none;
            padding: 3px;
            font-family: 'Arial Narrow', sans-serif;
            font-size: 9px;
            resize: vertical;
            background: transparent;
            min-height: 40px;
            white-space: pre-wrap;
            word-wrap: break-word;
            word-break: break-word;
            line-height: 1.3;
        }
        
        .items-table input {
            width: 100%;
            border: none;
            padding: 3px 2px;
            text-align: center;
            font-family: 'Arial Narrow', sans-serif;
            font-size: 9px;
        }
        
        .delete-item {
            background: #dc3545;
            color: white;
            border: none;
            padding: 2px 5px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 9px;
            font-family: 'Arial Narrow', sans-serif;
        }
        
        .add-item-btn {
            margin: 5px 0;
            padding: 3px 10px;
            font-size: 10px;
        }
        
        /* TOTALES POR PÁGINA */
        .page-totals {
            text-align: right;
            margin-top: 8px;
            padding: 6px 12px;
            background: #f8fafc;
            border-radius: 6px;
            border: 1px solid #c0d4e5;
            z-index: 2;
            position: relative;
        }
        
        .page-totals p { margin: 2px 0; font-size: 10px; font-family: 'Arial Narrow', sans-serif; }
        .page-grand-total { font-size: 12px; font-weight: 800; color: #1f4e79; }
        
        .igv-toggle {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 4px;
            padding-bottom: 3px;
            border-bottom: 1px solid #c0d4e5;
        }
        
        .igv-toggle label { font-weight: 600; color: #1f4e79; cursor: pointer; font-family: 'Arial Narrow', sans-serif; font-size: 9px; }
        
        /* TOTAL GENERAL (solo en última página) */
        .total-general-container {
            margin: 15px 0;
            padding: 8px 15px;
            background: #1f4e79;
            color: white;
            border-radius: 8px;
            text-align: right;
        }
        
        .total-general-container p {
            font-size: 16px;
            font-weight: bold;
        }
        
        /* FIRMA Y PAGO EN LA MISMA LÍNEA - SOLO ÚLTIMA PÁGINA */
        .signature-payment-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 15px 0 15px 0;
            z-index: 2;
            position: relative;
            flex-wrap: nowrap;
        }
        
        .payment-methods {
            flex: 1;
            background: #f0f7ff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #c0d8e8;
        }
        
        .payment-methods h5 {
            color: #1f4e79;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 11px;
            border-bottom: 1px solid #c0d4e5;
            padding-bottom: 3px;
            font-family: 'Arial Narrow', sans-serif;
        }
        
        .payment-methods p {
            font-size: 9px;
            margin: 3px 0;
            font-family: 'Arial Narrow', monospace;
        }
        
        .signature-area {
            flex: 1;
            text-align: center;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #c0d4e5;
        }
        
        .signature-area h5 {
            color: #1f4e79;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 11px;
            font-family: 'Arial Narrow', sans-serif;
        }
        
        .firma-img {
            max-width: 150px;
            max-height: 50px;
            object-fit: contain;
            border: none;
            padding: 2px;
            background: white;
        }
        
        .firma-fisica, .firma-digital {
            margin-top: 6px;
            padding: 5px;
            border: 1px dashed #c0d4e5;
            border-radius: 6px;
        }
        
        .firma-fisica button, .firma-digital button {
            background: #1f4e79;
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 8px;
            cursor: pointer;
            margin: 2px;
            font-family: 'Arial Narrow', sans-serif;
        }
        
        .signature-info {
            font-size: 7px;
            color: #5a7a9a;
            margin-top: 4px;
            font-style: italic;
            font-family: 'Arial Narrow', sans-serif;
            text-align: left;
        }
        
        /* PIE DE PÁGINA FIJO - IDÉNTICO EN TODAS LAS PÁGINAS */
        .footer-fixed {
            margin-top: 12px;
            padding-top: 6px;
            border-top: 1px solid #c0d4e5;
            background: white;
            position: relative;
            z-index: 2;
        }
        
        .footer-pages {
            font-size: 8px;
            color: #7a9aba;
            display: flex;
            justify-content: space-between;
            font-family: 'Arial Narrow', sans-serif;
            margin-bottom: 5px;
        }
        
        .footer-center {
            text-align: center;
            font-size: 7px;
            font-family: 'Arial Narrow', sans-serif;
            color: #7a9aba;
        }
        
        .footer-center p {
            margin: 1px 0;
        }
        
        /* Vista previa */
        #preview {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow: auto;
            padding: 30px;
        }
        
        .previewA4 { 
            background: white; 
            width: 210mm; 
            margin: 0 auto; 
            position: relative;
        }
        
        .close-preview {
            position: fixed;
            top: 20px;
            right: 30px;
            background: white;
            border: none;
            font-size: 20px;
            border-radius: 50%;
            padding: 8px 18px;
            cursor: pointer;
            font-weight: bold;
            z-index: 1001;
            font-family: 'Arial Narrow', sans-serif;
        }
        
        /* ESTILOS PARA PDF */
        .pdf .logo-buttons, .pdf .firma-fisica button, .pdf .firma-digital button, .pdf .delete-item, .pdf .add-item-btn {
            display: none !important;
        }
        
        .pdf input, .pdf textarea, .pdf .editable {
            border: none !important;
            padding: 2px !important;
            background: transparent !important;
        }
        
        .pdf .items-table td {
            border: 1px solid #ccc !important;
        }
        
        .pdf .watermark {
            position: absolute;
            z-index: 100;
        }
        
        @media print {
            body * { visibility: hidden; }
            .a4-page, .a4-page * { visibility: visible; }
            .a4-page { position: absolute; left: 0; top: 0; margin: 0; padding: 0; box-shadow: none; }
        }
        
        @media (max-width: 800px) {
            .company-name { font-size: 20px; }
            .logo { width: 55px; }
            .logo-buttons { top: 55px; gap: 6px; }
            .signature-payment-row { flex-direction: column; }
            .quote-number input { font-size: 14px; min-width: 120px; }
            .dates-right { text-align: left; }
            .dates-right div { text-align: left; }
            .a4-page { width: 100%; }
        }
    </style>
</head>
<body>

<div id="login">
    <div class="loginBox">
        <h3>VIDRIOS Y ALUMINIOS YURI</h3>
        <div class="subtitle">Sistema de Cotizaciones Profesional</div>
        <div class="login-tabs">
            <button class="login-tab active" onclick="mostrarFormulario('ruc')">RUC</button>
            <button class="login-tab" onclick="mostrarFormulario('celular')">Celular</button>
            <button class="login-tab" onclick="mostrarFormulario('codigo')">Código SMS</button>
        </div>
        <div id="form-ruc" class="login-form active">
            <input type="text" id="rucInput" placeholder="RUC / Usuario" autocomplete="off">
            <div class="password-wrapper">
                <input type="password" id="passRuc" placeholder="Contraseña">
                <button type="button" class="toggle-password" onclick="togglePassword('passRuc', this)">Mostrar</button>
            </div>
            <button class="btn-login" onclick="loginRuc()">Ingresar con RUC</button>
        </div>

<script>

    let codigoEnviado = null;
    let cotizaciones = [];

    function mostrarFormulario(tipo) {
        document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.querySelectorAll('.login-form').forEach(f => f.classList.remove('active'));
        document.getElementById(`form-${tipo}`).classList.add('active');
        document.getElementById('loginError').innerText = '';
        document.getElementById('loginSuccess').innerText = '';
    }

    function togglePassword(inputId, btn) {
        let passInput = document.getElementById(inputId);
        if (passInput.type === 'password') { passInput.type = 'text'; btn.textContent = 'Ocultar'; }
        else { passInput.type = 'password'; btn.textContent = 'Mostrar'; }
    }

    function loginRuc() {
        let ruc = document.getElementById('rucInput').value.trim();
        let pass = document.getElementById('passRuc').value.trim();
        if (ruc === USUARIO_RUC && pass === CONTRASENA) ingresarAlSistema();
        else document.getElementById('loginError').innerText = 'RUC o Contraseña incorrectos';
    }

    function loginCelular() {
        let celular = document.getElementById('celularInput').value.trim();
        let pass = document.getElementById('passCel').value.trim();
        if (celular === USUARIO_CELULAR && pass === CONTRASENA) ingresarAlSistema();
        else document.getElementById('loginError').innerText = 'Celular o Contraseña incorrectos';
    }

    function enviarCodigo() {
        let celular = document.getElementById('celularCodeInput').value.trim();
        if (celular !== USUARIO_CELULAR) { document.getElementById('loginError').innerText = 'Número no registrado'; return; }
        codigoEnviado = '123456';
        document.getElementById('codeGroup').style.display = 'block';
        document.getElementById('loginSuccess').innerHTML = 'Código enviado: 123456 (simulado)';
        document.getElementById('codigoInput').value = '';
        setTimeout(() => { document.getElementById('loginSuccess').innerHTML = ''; }, 5000);
    }

    function verificarCodigo() {
        let codigo = document.getElementById('codigoInput').value.trim();
        if (codigo === codigoEnviado) ingresarAlSistema();
        else document.getElementById('loginError').innerText = 'Código incorrecto';
    }

    function ingresarAlSistema() {
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        cargarLogosGuardados();
        cargarFirmasGuardadas();
        nuevaCotizacion();
        cargarHistorial();
    }

    function cerrarSesion() {
        if (confirm('¿Cerrar sesión?')) {
            document.getElementById('login').style.display = 'flex';
            document.getElementById('app').style.display = 'none';
            document.getElementById('rucInput').value = '';
            document.getElementById('passRuc').value = '';
            document.getElementById('celularInput').value = '';
            document.getElementById('passCel').value = '';
            document.getElementById('celularCodeInput').value = '';
            document.getElementById('codigoInput').value = '';
            document.getElementById('codeGroup').style.display = 'none';
            codigoEnviado = null;
        }
    }

    function actualizarFechasImpresion() {
        let ahora = new Date();
        let fechaStr = ahora.toLocaleDateString('es-ES') + ' ' + ahora.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
        let printDates = document.querySelectorAll('#printDate');
        printDates.forEach(el => el.innerText = fechaStr);
    }

    function actualizarNumerosPagina() {
        let pages = document.querySelectorAll('.a4-page');
        pages.forEach((page, index) => {
            let pageNum = page.querySelector('.page-num');
            let totalPages = page.querySelector('.total-pages');
            if (pageNum) pageNum.innerText = index + 1;
            if (totalPages) totalPages.innerText = pages.length;
        });
    }

    function validarFechas() {
        let fechaEmision = new Date(document.getElementById('fecha').value);
        let fechaValidez = new Date(document.getElementById('fechaValidez').value);
        if (fechaValidez < fechaEmision) {
            alert('La fecha de validez no puede ser menor a la fecha de emisión');
            let nuevaValidez = new Date(fechaEmision);
            nuevaValidez.setDate(fechaEmision.getDate() + 15);
            document.getElementById('fechaValidez').valueAsDate = nuevaValidez;
        }
    }

    function generarNumero() {
        let contador = parseInt(localStorage.getItem('contador')) || 0;
        contador++;
        localStorage.setItem('contador', contador);
        return String(contador).padStart(4, '0') + '-' + new Date().getFullYear();
    }

    // Crear encabezado común para todas las páginas
    function crearEncabezadoComun() {

                <div class="header">
                    <img id="logo1" class="logo logo-left" style="display:none">
                    <img id="logo2" class="logo logo-right" style="display:none">

                        <button onclick="subirLogo('logo2')">Subir Logo Derecho</button>
                    </div>
                    <div class="company-name">VIDRIOS Y ALUMINIOS YURI</div>
                    <div class="company-owner">YURI HERMOZA PUELLES</div>
                    <div class="company-ruc">RUC: 10617365036</div>

                </div>

                </div>
                <div class="footer-center">
                    <p>CC.HACCA S/N OMACHÁ - PARURO - CUSCO</p>
                    <p>hermozayurihermozapuelles@gmail.com | 993963381</p>
                    <p><i>Todo lo puedo en Cristo que me fortalece - Filipenses 4:13</i></p>
                </div>
            </div>
        `;

    // Crear tabla de items vacía
    function crearTablaItems() {
        return `
            <table class="items-table">
                <thead>
                    <tr><th>#</th><th>Descripción</th><th>Cant.</th><th>Precio Unit.</th><th>Subtotal</th><th></th></tr>
                </thead>
                <tbody></tbody>
            </table>

            <div class="page-totals">

                <p>Subtotal Página: <span class="page-subtotal">0.00</span></p>
                <p class="page-igv-line">IGV Página: <span class="page-igv">0.00</span></p>
                <p class="page-grand-total">Total Página: <span class="page-total">0.00</span></p>
            </div>
        `;
    }

    // PÁGINA 1: Con datos de cliente
    function crearPaginaPrincipal(numPagina, totalPaginas) {
        let numero = generarNumero();
        let hoy = new Date();
        let fechaStr = hoy.toISOString().split('T')[0];

                <label>COTIZACIÓN N°</label>
                <input id="numCot" class="editable" value="${numero}">
            </div>
            <div class="dates-right">
                <div><b>FECHA DE EMISIÓN:</b> <input type="date" id="fecha" class="editable" value="${fechaStr}" onchange="validarFechas()"></div>
                <div><b>FECHA DE VALIDEZ:</b> <input type="date" id="fechaValidez" class="editable" value="${validezStr}" onchange="validarFechas()"></div>

            <div class="client-card">

                <div class="campo"><label>DNI / RUC:</label><input id="clienteDoc" class="editable" placeholder="Ej: 12345678"></div>

    // PÁGINA DE ITEMS (sin cliente, sin firma)

        let div = document.createElement('div');
        div.className = 'a4-page';
        div.innerHTML = `
            <div class="watermark">VIDRIOS Y ALUMINIOS YURI</div>

    // ÚLTIMA PÁGINA: Con firma y método de pago
    function crearPaginaFinal(numPagina, totalPaginas) {
        let ahora = new Date();
        let fechaStr = ahora.toLocaleDateString('es-ES');
        let horaStr = ahora.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
        
        let div = document.createElement('div');
        div.className = 'a4-page';
        div.innerHTML = `
            <div class="watermark">VIDRIOS Y ALUMINIOS YURI</div>
            ${crearEncabezadoComun()}
            <div class="total-general-container">

            <div class="signature-payment-row">
                <div class="payment-methods">
                    <h5>MÉTODOS DE PAGO</h5>
                    <p><strong>BCP:</strong> 52671107164027</p>
                    <p><strong>CCI:</strong> 00252617110716402721</p>
                    <p><strong>Yape/Plin:</strong> 993963381</p>
                </div>
                <div class="signature-area">
                    <h5>FIRMA AUTORIZADA</h5>

                    <div class="firma-digital">

    function agregarItemEnPagina(btn) {
        let page = btn.closest('.a4-page');
        let tbody = page.querySelector('.items-table tbody');
        let rowCount = tbody.rows.length + 1;
        let fila = document.createElement('tr');
        fila.innerHTML = `<td style="text-align:center">${rowCount}</td>
                          <td><textarea rows="2" placeholder="Detalle del producto..." onchange="calcularTotalesGlobales()" style="width:100%; min-height:40px;"></textarea></td>
                          <td><input type="number" value="1" min="0" step="1" onchange="calcularTotalesGlobales()"></td>
                          <td><input type="number" value="0" min="0" step="0.01" onchange="calcularTotalesGlobales()"></td>
                          <td class="subtotal-cell" style="text-align:right;">0.00</td>
                          <td style="text-align:center"><button class="delete-item" onclick="eliminarItemDePagina(this)">X</button></td>`;
        tbody.appendChild(fila);
        calcularTotalesGlobales();
    }

    function eliminarItemDePagina(boton) {
        if (confirm('¿Eliminar este item?')) {
            boton.closest('tr').remove();
            renumerarItems(boton.closest('.a4-page'));
            calcularTotalesGlobales();
        }
    }

    function renumerarItems(page) {
        let rows = page.querySelectorAll('.items-table tbody tr');
        rows.forEach((row, idx) => row.cells[0].innerText = idx + 1);
    }

    function calcularTotalesGlobales() {
        let pages = document.querySelectorAll('.a4-page');
        let subtotalGlobal = 0;
        let monedaSelect = document.getElementById('moneda');
        let moneda = monedaSelect ? monedaSelect.value : 'PEN';
        let sim = moneda === 'PEN' ? 'S/ ' : '$ ';
        
        pages.forEach(page => {
            let incluirIGVCheck = page.querySelector('.incluirIGV');
            let incluirIGV = incluirIGVCheck ? incluirIGVCheck.checked : true;
            let subtotalPagina = 0;
            let rows = page.querySelectorAll('.items-table tbody tr');
            
            rows.forEach(row => {
                let cant = parseFloat(row.querySelector('td:nth-child(3) input').value) || 0;
                let precio = parseFloat(row.querySelector('td:nth-child(4) input').value) || 0;
                let sub = cant * precio;
                let subtotalCell = row.querySelector('.subtotal-cell');
                if (subtotalCell) subtotalCell.innerText = sub.toFixed(2);
                subtotalPagina += sub;
            });
            subtotalGlobal += subtotalPagina;
            
            let pageSubtotalSpan = page.querySelector('.page-subtotal');
            let pageIgvSpan = page.querySelector('.page-igv');
            let pageTotalSpan = page.querySelector('.page-total');
            let pageIgvLine = page.querySelector('.page-igv-line');
            
            if (pageSubtotalSpan) {
                let igvPagina = incluirIGV ? subtotalPagina * 0.18 : 0;
                let totalPagina = subtotalPagina + igvPagina;
                pageSubtotalSpan.innerText = sim + subtotalPagina.toFixed(2);
                if (pageIgvSpan) pageIgvSpan.innerText = sim + igvPagina.toFixed(2);
                if (pageTotalSpan) pageTotalSpan.innerText = sim + totalPagina.toFixed(2);
                if (pageIgvLine) pageIgvLine.style.display = incluirIGV ? 'block' : 'none';
            }
        });
        
        let igvGlobal = subtotalGlobal * 0.18;
        let totalGlobal = subtotalGlobal + igvGlobal;
        let totalGeneralSpan = document.getElementById('totalGeneral');
        if (totalGeneralSpan) totalGeneralSpan.innerText = sim + totalGlobal.toFixed(2);
    }

    function agregarPaginaItems() {
        let container = document.getElementById('pagesContainer');
        let paginaFinal = container.querySelector('.final-page');
        let paginasItems = container.querySelectorAll('.a4-page:not(.final-page)');
        
        let nuevaPagina = crearPaginaItems(paginasItems.length + 1, paginasItems.length + 2);
        
        if (paginaFinal) {
            paginaFinal.remove();
            container.appendChild(nuevaPagina);
            let nuevaPaginaFinal = crearPaginaFinal(paginasItems.length + 2, paginasItems.length + 2);
            nuevaPaginaFinal.classList.add('final-page');
            container.appendChild(nuevaPaginaFinal);
        } else {
            container.appendChild(nuevaPagina);
            let nuevaPaginaFinal = crearPaginaFinal(paginasItems.length + 1, paginasItems.length + 1);
            nuevaPaginaFinal.classList.add('final-page');
            container.appendChild(nuevaPaginaFinal);
        }
        
        actualizarNumerosPagina();
        cargarLogosEnPaginas();
        cargarFirmasEnPaginas();
        sincronizarDatosPaginas();
        calcularTotalesGlobales();
    }

    function sincronizarDatosPaginas() {
        let numCot = document.getElementById('numCot')?.value;
        let fecha = document.getElementById('fecha')?.value;
        let fechaValidez = document.getElementById('fechaValidez')?.value;
        let moneda = document.getElementById('moneda')?.value;
        let direccion = document.getElementById('direccionEmpresa')?.value;
        
        let pages = document.querySelectorAll('.a4-page');
        pages.forEach(page => {
            let numCotInput = page.querySelector('#numCot');
            let fechaInput = page.querySelector('#fecha');
            let validezInput = page.querySelector('#fechaValidez');
            let monedaSelect = page.querySelector('#moneda');
            let direccionInput = page.querySelector('#direccionEmpresa');
            
            if (numCotInput && numCot && !numCotInput.value) numCotInput.value = numCot;
            if (fechaInput && fecha && !fechaInput.value) fechaInput.value = fecha;
            if (validezInput && fechaValidez && !validezInput.value) validezInput.value = fechaValidez;
            if (monedaSelect && moneda && !monedaSelect.value) monedaSelect.value = moneda;
            if (direccionInput && direccion && !direccionInput.value) direccionInput.value = direccion;
        });
    }

    function cargarLogosEnPaginas() {
        let logo1 = localStorage.getItem('logo1');
        let logo2 = localStorage.getItem('logo2');
        let pages = document.querySelectorAll('.a4-page');
        pages.forEach(page => {
            let img1 = page.querySelector('#logo1');
            let img2 = page.querySelector('#logo2');
            if (img1 && logo1) { img1.src = logo1; img1.style.display = 'block'; }
            if (img2 && logo2) { img2.src = logo2; img2.style.display = 'block'; }
        });
    }

    function cargarFirmasEnPaginas() {
        let firmaFisica = localStorage.getItem('firmaFisica');
        let firmaDigitalHTML = localStorage.getItem('firmaDigitalHTML');
        
        let firmaImgs = document.querySelectorAll('.firma-img');
        if (firmaFisica) firmaImgs.forEach(img => { img.src = firmaFisica; img.style.display = 'block'; });
        
        let digitalInfos = document.querySelectorAll('.firma-digital .signature-info');
        if (firmaDigitalHTML) digitalInfos.forEach(info => info.innerHTML = firmaDigitalHTML);
    }

    function nuevaCotizacion() {
        if (confirm('¿Crear nueva cotización?')) {
            let container = document.getElementById('pagesContainer');
            container.innerHTML = '';
            
            let paginaPrincipal = crearPaginaPrincipal(1, 2);
            let paginaFinal = crearPaginaFinal(2, 2);
            paginaFinal.classList.add('final-page');
            
            container.appendChild(paginaPrincipal);
            container.appendChild(paginaFinal);
            
            agregarItemEnPagina(paginaPrincipal.querySelector('.add-item-btn'));
            
            actualizarNumerosPagina();
            cargarLogosEnPaginas();
            cargarFirmasEnPaginas();
            actualizarFechasImpresion();
            calcularTotalesGlobales();
        }
    }

    function subirLogo(posicion) {
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function(e) {
            let file = e.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(event) {
                    let pages = document.querySelectorAll('.a4-page');
                    pages.forEach(page => {
                        let img = page.querySelector(`#${posicion}`);
                        if (img) { img.src = event.target.result; img.style.display = 'block'; }
                    });
                    localStorage.setItem(posicion, event.target.result);
                };
                reader.readAsDataURL(file);
            }
        };
        input.click();
    }

    function cargarLogosGuardados() {
        let logo1 = localStorage.getItem('logo1');
        let logo2 = localStorage.getItem('logo2');
        let pages = document.querySelectorAll('.a4-page');
        pages.forEach(page => {
            if (logo1) { let img1 = page.querySelector('#logo1'); if(img1){ img1.src = logo1; img1.style.display = 'block'; } }
            if (logo2) { let img2 = page.querySelector('#logo2'); if(img2){ img2.src = logo2; img2.style.display = 'block'; } }
        });
    }

    function subirFirma() {
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function(e) {
            let file = e.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(event) {
                    let firmaImgs = document.querySelectorAll('.firma-img');
                    firmaImgs.forEach(img => { img.src = event.target.result; img.style.display = 'block'; });
                    localStorage.setItem('firmaFisica', event.target.result);
                    alert('Firma física subida correctamente');
                };
                reader.readAsDataURL(file);
            }
        };
        input.click();
    }

    function limpiarFirmaFisica() {
        if (confirm('¿Eliminar firma física?')) {
            let firmaImgs = document.querySelectorAll('.firma-img');
            firmaImgs.forEach(img => { img.style.display = 'none'; img.src = ''; });
            localStorage.removeItem('firmaFisica');
        }
    }

    function generarFirmaDigital() {
        let fechaActual = new Date();
        let fechaStr = fechaActual.toLocaleDateString('es-ES');
        let horaStr = fechaActual.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
        
        let firmaDigitalHTML = `
            <div style="font-family:'Arial Narrow'; font-size:8px; text-align:left; margin-top:6px; padding:5px; border-top:1px solid #c0d4e5;">
                <strong>FIRMA DIGITAL AUTORIZADA</strong><br>
                YURI HERMOZA PUELLES<br>
                DNI: 61736503<br>
                Fecha: ${fechaStr} - ${horaStr}<br>
                <em>Autorización legal Ley N° 27269</em>
            </div>
        `;
        
        localStorage.setItem('firmaDigitalHTML', firmaDigitalHTML);
        let digitalInfos = document.querySelectorAll('.firma-digital .signature-info');
        digitalInfos.forEach(info => info.innerHTML = firmaDigitalHTML);
        alert('Firma digital generada correctamente');
    }

    function limpiarFirmaDigital() {
        if (confirm('¿Eliminar firma digital?')) {
            let digitalInfos = document.querySelectorAll('.firma-digital .signature-info');
            digitalInfos.forEach(info => info.innerHTML = '');
            localStorage.removeItem('firmaDigitalHTML');
        }
    }

    function cargarFirmasGuardadas() {
        let firmaFisica = localStorage.getItem('firmaFisica');
        let firmaDigitalHTML = localStorage.getItem('firmaDigitalHTML');
        
        let firmaImgs = document.querySelectorAll('.firma-img');
        if (firmaFisica) firmaImgs.forEach(img => { img.src = firmaFisica; img.style.display = 'block'; });
        
        let digitalInfos = document.querySelectorAll('.firma-digital .signature-info');
        if (firmaDigitalHTML) digitalInfos.forEach(info => info.innerHTML = firmaDigitalHTML);
    }

    async function descargarPDF() {
        let cliente = document.getElementById('clienteNombre')?.value || 'Cliente';
        let numCot = document.getElementById('numCot')?.value || '0000';
        let container = document.getElementById('pagesContainer').cloneNode(true);
        
        // Convertir textareas a divs
        let textareas = container.querySelectorAll('textarea');
        textareas.forEach(ta => {
            let div = document.createElement('div');
            div.style.whiteSpace = 'pre-wrap';
            div.style.wordWrap = 'break-word';
            div.style.fontFamily = 'Arial Narrow';
            div.style.fontSize = '9px';
            div.style.padding = '3px';
            div.style.minHeight = '40px';
            div.innerText = ta.value;
            ta.parentNode.replaceChild(div, ta);
        });
        
        // Ocultar botones
        let buttons = container.querySelectorAll('.logo-buttons, .firma-fisica button, .firma-digital button, .delete-item, .add-item-btn');
        buttons.forEach(btn => { if(btn) btn.style.display = 'none'; });
        
        container.classList.add('pdf');
        
        const opt = {
            margin: [0.4, 0.4, 0.4, 0.4],
            filename: `Cotizacion_${numCot}_${cliente.replace(/[^a-z0-9]/gi, '_')}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, letterRendering: true },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };
        
        await html2pdf().set(opt).from(container).save();
    }

    function vistaPrevia() {
        let container = document.getElementById('pagesContainer').cloneNode(true);
        
        let textareas = container.querySelectorAll('textarea');
        textareas.forEach(ta => {
            let div = document.createElement('div');
            div.style.whiteSpace = 'pre-wrap';
            div.style.wordWrap = 'break-word';
            div.style.fontFamily = 'Arial Narrow';
            div.style.fontSize = '9px';
            div.style.padding = '3px';
            div.style.minHeight = '40px';
            div.innerText = ta.value;
            ta.parentNode.replaceChild(div, ta);
        });
        
        let buttons = container.querySelectorAll('.logo-buttons, .firma-fisica button, .firma-digital button, .delete-item, .add-item-btn');
        buttons.forEach(btn => { if(btn) btn.style.display = 'none'; });
        
        document.getElementById('previewContent').innerHTML = '';
        document.getElementById('previewContent').appendChild(container);
        document.getElementById('preview').style.display = 'block';
    }
    
    function cerrarPreview() { document.getElementById('preview').style.display = 'none'; }

    function guardarCotizacion() {
        let items = [];
        let pages = document.querySelectorAll('.a4-page');
        pages.forEach(page => {
            let rows = page.querySelectorAll('.items-table tbody tr');
            rows.forEach(row => {
                items.push({ 
                    desc: row.querySelector('textarea').value, 
                    cant: row.querySelector('td:nth-child(3) input').value, 
                    precio: row.querySelector('td:nth-child(4) input').value, 
                    subtotal: row.querySelector('.subtotal-cell').innerText 
                });
            });
        });
        
        let cotizacion = {
            id: Date.now(),
            numero: document.getElementById('numCot')?.value,
            fecha: document.getElementById('fecha')?.value,
            fechaValidez: document.getElementById('fechaValidez')?.value,
            moneda: document.getElementById('moneda')?.value,
            cliente: {
                nombre: document.getElementById('clienteNombre')?.value,
                documento: document.getElementById('clienteDoc')?.value,
                celular: document.getElementById('clienteCel')?.value,
                direccion: document.getElementById('clienteDir')?.value
            },
            items: items,
            totalFinal: document.getElementById('totalGeneral')?.innerText
        };
        
        cotizaciones = cotizaciones.filter(c => c.id !== cotizacion.id);
        cotizaciones.unshift(cotizacion);
        if (cotizaciones.length > 100) cotizaciones = cotizaciones.slice(0, 100);
        localStorage.setItem('cotizaciones', JSON.stringify(cotizaciones));
        cargarHistorial();
        alert('Cotización guardada');
    }

    function eliminarCotizacion(id, event) {
        event.stopPropagation();
        if (confirm('¿Eliminar esta cotización?')) {
            cotizaciones = cotizaciones.filter(c => c.id !== id);
            localStorage.setItem('cotizaciones', JSON.stringify(cotizaciones));
            cargarHistorial();
            alert('Cotización eliminada');
        }
    }

    function limpiarTodoHistorial() {
        if (confirm('⚠️ ¿Eliminar TODAS las cotizaciones?')) {
            cotizaciones = [];
            localStorage.setItem('cotizaciones', JSON.stringify(cotizaciones));
            cargarHistorial();
            alert('Historial limpiado');
        }
    }

    function cargarHistorial() {
        cotizaciones = JSON.parse(localStorage.getItem('cotizaciones') || '[]');
        filtrarHistorial();
    }

    function filtrarHistorial() {
        let searchTerm = document.getElementById('searchHistory')?.value.toLowerCase() || '';
        let filtered = cotizaciones.filter(cot => 
            cot.numero?.toLowerCase().includes(searchTerm) || 
            (cot.cliente?.nombre || '').toLowerCase().includes(searchTerm)
        );
        
        let div = document.getElementById('historial');
        div.innerHTML = '';
        
        if (filtered.length === 0) {
            div.innerHTML = '<p style="color:#8aaec0; text-align:center; padding:20px;">No hay cotizaciones</p>';
            return;
        }
        
        filtered.forEach(cot => {
            let item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="history-info" onclick='cargarCotizacion(${cot.id})'>
                    <strong>${cot.numero}</strong><br>
                    ${cot.cliente?.nombre || 'Anónimo'}<br>
                    <small>${cot.fecha} | ${cot.totalFinal}</small>
                </div>
                <div class="history-actions">
                    <button class="btn-edit" onclick='cargarCotizacion(${cot.id})'>✏️</button>
                    <button class="btn-delete" onclick='eliminarCotizacion(${cot.id}, event)'>🗑️</button>
                </div>
            `;
            div.appendChild(item);
        });
    }

    function cargarCotizacion(id) {
        let cot = cotizaciones.find(c => c.id === id);
        if (!cot) return;
        
        if (confirm(`Cargar cotización ${cot.numero}?`)) {
            nuevaCotizacion();
            
            setTimeout(() => {
                if (document.getElementById('numCot')) document.getElementById('numCot').value = cot.numero;
                if (document.getElementById('fecha')) document.getElementById('fecha').value = cot.fecha;
                if (document.getElementById('fechaValidez')) document.getElementById('fechaValidez').value = cot.fechaValidez || '';
                if (document.getElementById('moneda')) document.getElementById('moneda').value = cot.moneda || 'PEN';
                if (document.getElementById('clienteNombre')) document.getElementById('clienteNombre').value = cot.cliente?.nombre || '';
                if (document.getElementById('clienteDoc')) document.getElementById('clienteDoc').value = cot.cliente?.documento || '';
                if (document.getElementById('clienteCel')) document.getElementById('clienteCel').value = cot.cliente?.celular || '';
                if (document.getElementById('clienteDir')) document.getElementById('clienteDir').value = cot.cliente?.direccion || '';
                
                let tbody = document.querySelector('.items-table tbody');
                if (tbody) {
                    tbody.innerHTML = '';
                    if (cot.items && cot.items.length) {
                        cot.items.forEach((item, idx) => {
                            let fila = document.createElement('tr');
                            fila.innerHTML = `<td style="text-align:center">${idx+1}</td>
                                                <td><textarea rows="2" style="width:100%; min-height:40px;">${escapeHtml(item.desc || '')}</textarea></td>
                                                <td><input type="number" value="${item.cant || 0}" onchange="calcularTotalesGlobales()"></td>
                                                <td><input type="number" value="${item.precio || 0}" onchange="calcularTotalesGlobales()"></td>
                                                <td class="subtotal-cell" style="text-align:right;">${item.subtotal || '0.00'}</td>
                                                <td><button class="delete-item" onclick="eliminarItemDePagina(this)">X</button></td>`;
                            tbody.appendChild(fila);
                        });
                    }
                }
                calcularTotalesGlobales();
            }, 100);
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function exportarHistorial() {
        if (cotizaciones.length === 0) { alert('No hay cotizaciones'); return; }
        let dataStr = JSON.stringify(cotizaciones, null, 2);
        let dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
        let link = document.createElement('a');
        link.setAttribute('href', dataUri);
        link.setAttribute('download', `cotizaciones_${new Date().toISOString().slice(0,19)}.json`);
        link.click();
    }
</script>
