<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vidrios y Aluminios Yuri | Sistema de Cotizaciones</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Narrow', 'Segoe UI', sans-serif;
            background: #f0f2f5;
            color: #333;
        }

        /* LOGIN */
        #login {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1f4e79 0%, #0d2b45 100%);
            padding: 20px;
        }
        .loginBox {
            background: white;
            padding: 35px;
            width: 420px;
            max-width: 100%;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            text-align: center;
        }
        .loginBox h3 {
            font-family: 'Arial Narrow', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #1f4e79;
            margin-bottom: 10px;
        }
        .loginBox .subtitle {
            font-size: 13px;
            color: #6c8daa;
            margin-bottom: 25px;
        }
        .login-tabs {
            display: flex;
            gap: 5px;
            background: #f0f4f8;
            border-radius: 50px;
            padding: 5px;
            margin-bottom: 25px;
        }
        .login-tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: 40px;
            font-family: 'Arial Narrow', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            color: #5a7a9a;
        }
        .login-tab.active {
            background: #1f4e79;
            color: white;
        }
        .login-form {
            display: none;
            text-align: left;
        }
        .login-form.active {
            display: block;
        }
        .login-form input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #c0d4e5;
            border-radius: 12px;
            font-family: 'Arial Narrow', sans-serif;
            font-size: 15px;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 70px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #1f4e79;
            font-size: 12px;
            background: none;
            border: none;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Arial Narrow', sans-serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-login:hover { background: #0d3b5a; }
        .btn-verify { background: #28a745; }
        .btn-verify:hover { background: #218838; }
        .code-group { display: none; margin-top: 10px; }
        .error-msg { color: #d32f2f; font-size: 13px; margin-top: 10px; text-align: center; }
        .success-msg { color: #28a745; font-size: 13px; margin-top: 10px; text-align: center; }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #aaa;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }
        .divider span { padding: 0 10px; }

        /* APP */
        #app {
            display: none;
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
        }
        .dashboard-header {
            background: white;
            border-radius: 16px;
            padding: 15px 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .dashboard-header h2 {
            font-family: 'Arial Narrow', sans-serif;
            font-weight: 700;
            color: #1f4e79;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Arial Narrow', sans-serif;
            font-size: 14px;
        }
        .btn-primary { background: #1f4e79; color: white; }
        .btn-primary:hover { background: #0d3b5a; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-warning:hover { background: #e0a800; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }
        .btn-info { background: #17a2b8; color: white; }
        .btn-info:hover { background: #138496; }

        .workspace {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .quote-area {
            flex: 2.5;
            min-width: 320px;
            max-width: 100%;
            overflow-x: auto;
        }
        .history-area {
            flex: 1;
            min-width: 280px;
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-height: 80vh;
            overflow-y: auto;
        }
        .history-area h3 {
            font-family: 'Arial Narrow', sans-serif;
            font-weight: 700;
            color: #1f4e79;
            margin-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 8px;
        }
        .history-search {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 15px;
            border: 1px solid #c0d4e5;
            border-radius: 8px;
            font-family: 'Arial Narrow', sans-serif;
        }
        .history-item {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 10px;
            font-size: 13px;
            border-left: 4px solid #1f4e79;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:hover { background: #e9ecef; }
        .history-info { flex: 1; }
        .history-actions { display: flex; gap: 8px; }
        .history-actions button {
            padding: 4px 8px;
            font-size: 11px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-edit { background: #ffc107; }
        .btn-delete { background: #dc3545; color: white; }

        /* PÁGINA A4 - ESTRUCTURA FIJA CON TABLAS */
        .a4-page {
            background: white;
            width: 210mm;
            height: 297mm;
            margin: 0 auto 20px auto;
            padding: 8mm;
            position: relative;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
            page-break-after: always;
            box-sizing: border-box;
            font-family: 'Arial Narrow', sans-serif;
            font-size: 10px;
        }

        /* MARCA DE AGUA */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 40px;
            font-weight: 900;
            color: rgba(31, 78, 121, 0.06);
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 4px;
            z-index: 0;
        }

        /* CONTENIDO PRINCIPAL */
        .page-content {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ENCABEZADO */
        .header-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 8px;
        }
        .header-table td {
            border: none;
            padding: 2px;
            vertical-align: middle;
        }
        .logo-cell {
            width: 70px;
            text-align: center;
        }
        .logo-img {
            max-width: 65px;
            max-height: 60px;
        }
        .title-cell {
            text-align: center;
        }
        .company-name {
            font-size: 20px;
            font-weight: 800;
            color: #1f4e79;
        }
        .company-owner {
            font-size: 11px;
            font-weight: bold;
            color: #2c5a7a;
        }
        .company-ruc {
            font-size: 9px;
            color: #5a6e7a;
        }
        .company-dir input {
            font-size: 9px;
            padding: 2px 8px;
            border: 1px solid #ccc;
            border-radius: 15px;
            width: 80%;
            text-align: center;
        }

        /* NÚMERO COTIZACIÓN */
        .quote-number {
            background: linear-gradient(135deg, #1f4e79, #0d3b5a);
            text-align: center;
            padding: 5px;
            border-radius: 6px;
            margin: 5px 0;
        }
        .quote-number label {
            color: white;
            font-size: 12px;
            font-weight: bold;
            margin-right: 10px;
        }
        .quote-number input {
            background: transparent;
            border: 1px solid white;
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 5px;
            width: 150px;
            text-align: center;
        }

        /* FECHAS */
        .dates-table {
            width: 100%;
            text-align: right;
            margin: 5px 0;
        }
        .dates-table td {
            padding: 2px 5px;
            font-size: 9px;
        }
        .dates-table input, .dates-table select {
            font-size: 9px;
            padding: 2px 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* CLIENTE */
        .client-card {
            background: #e8f4fd;
            border: 1px solid #c0d8e8;
            border-radius: 6px;
            padding: 6px 10px;
            margin: 5px 0;
        }
        .client-card h4 {
            font-size: 11px;
            color: #1f4e79;
            margin-bottom: 5px;
            border-left: 3px solid #1f4e79;
            padding-left: 8px;
        }
        .client-row {
            display: flex;
            margin-bottom: 3px;
            gap: 5px;
        }
        .client-row label {
            width: 100px;
            font-weight: bold;
            font-size: 9px;
            color: #1f4e79;
        }
        .client-row input {
            flex: 1;
            font-size: 9px;
            padding: 2px 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* TABLA DE ITEMS */
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 8px;
        }
        .items-table th {
            background: #1f4e79;
            color: white;
            padding: 4px;
            text-align: center;
            border: 1px solid #2c5a7a;
        }
        .items-table td {
            border: 1px solid #ccc;
            padding: 3px;
            vertical-align: top;
        }
        .items-table textarea {
            width: 100%;
            border: none;
            font-size: 8px;
            font-family: 'Arial Narrow', sans-serif;
            resize: vertical;
            min-height: 35px;
            background: transparent;
        }
        .items-table input {
            width: 100%;
            border: none;
            font-size: 8px;
            text-align: center;
            background: transparent;
        }
        .delete-item {
            background: #dc3545;
            color: white;
            border: none;
            padding: 2px 5px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 7px;
        }
        .add-item-btn {
            margin: 5px 0;
            padding: 3px 10px;
            font-size: 9px;
        }

        /* TOTALES POR PÁGINA */
        .page-totals {
            text-align: right;
            padding: 5px 10px;
            background: #f8fafc;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 5px 0;
        }
        .page-totals p {
            margin: 2px 0;
            font-size: 9px;
        }

        /* TOTAL GENERAL - SOLO ÚLTIMA PÁGINA */
        .total-general {
            background: #1f4e79;
            color: white;
            text-align: right;
            padding: 6px 12px;
            border-radius: 5px;
            margin: 8px 0;
        }
        .total-general p {
            font-size: 14px;
            font-weight: bold;
        }

        /* FIRMA Y PAGO - MISMA LÍNEA */
        .signature-payment {
            display: flex;
            gap: 15px;
            margin: 10px 0;
        }
        .payment-box {
            flex: 1;
            background: #f0f7ff;
            border: 1px solid #c0d8e8;
            border-radius: 6px;
            padding: 6px;
        }
        .payment-box h5 {
            font-size: 10px;
            color: #1f4e79;
            border-bottom: 1px solid #ccc;
            padding-bottom: 3px;
            margin-bottom: 5px;
        }
        .payment-box p {
            font-size: 8px;
            margin: 2px 0;
        }
        .signature-box {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 6px;
            text-align: center;
        }
        .signature-box h5 {
            font-size: 10px;
            color: #1f4e79;
            margin-bottom: 5px;
        }
        .firma-img {
            max-width: 130px;
            max-height: 45px;
        }
        .signature-box button {
            background: #1f4e79;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 7px;
            cursor: pointer;
            margin: 2px;
        }
        .signature-info {
            font-size: 6px;
            color: #666;
            margin-top: 4px;
        }

        /* PIE DE PÁGINA */
        .footer {
            margin-top: auto;
            padding-top: 6px;
            border-top: 1px solid #ccc;
            font-size: 7px;
            color: #888;
        }
        .footer-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        .footer-center {
            text-align: center;
        }

        /* BOTONES DE CONTROL */
        .page-controls {
            text-align: center;
            margin: 20px 0;
        }

        /* VISTA PREVIA */
        #preview {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow: auto;
            padding: 30px;
        }
        .previewA4 { background: white; width: 210mm; margin: 0 auto; }
        .close-preview {
            position: fixed;
            top: 20px;
            right: 30px;
            background: white;
            border: none;
            font-size: 20px;
            border-radius: 50%;
            padding: 8px 18px;
            cursor: pointer;
            font-weight: bold;
            z-index: 1001;
        }

        /* PDF STYLES */
        .pdf .logo-buttons, .pdf .add-item-btn, .pdf .delete-item,
        .pdf .signature-box button, .pdf .firma-fisica button, .pdf .firma-digital button {
            display: none !important;
        }
        .pdf textarea, .pdf input {
            border: none !important;
            background: transparent !important;
        }
    </style>
</head>
<body>

<div id="login">
    <div class="loginBox">
        <h3>VIDRIOS Y ALUMINIOS YURI</h3>
        <div class="subtitle">Sistema de Cotizaciones Profesional</div>
        <div class="login-tabs">
            <button class="login-tab active" onclick="mostrarFormulario('ruc')">RUC</button>
            <button class="login-tab" onclick="mostrarFormulario('celular')">Celular</button>
            <button class="login-tab" onclick="mostrarFormulario('codigo')">Código SMS</button>
        </div>
        <div id="form-ruc" class="login-form active">
            <input type="text" id="rucInput" placeholder="RUC / Usuario">
            <div class="password-wrapper">
                <input type="password" id="passRuc" placeholder="Contraseña">
                <button type="button" class="toggle-password" onclick="togglePassword('passRuc', this)">Mostrar</button>
            </div>
            <button class="btn-login" onclick="loginRuc()">Ingresar con RUC</button>
        </div>
        <div id="form-celular" class="login-form">
            <input type="tel" id="celularInput" placeholder="Número de celular">
            <div class="password-wrapper">
                <input type="password" id="passCel" placeholder="Contraseña">
                <button type="button" class="toggle-password" onclick="togglePassword('passCel', this)">Mostrar</button>
            </div>
            <button class="btn-login" onclick="loginCelular()">Ingresar con Celular</button>
        </div>
        <div id="form-codigo" class="login-form">
            <input type="tel" id="celularCodeInput" placeholder="Número de celular">
            <button class="btn-login btn-verify" onclick="enviarCodigo()">Enviar código SMS</button>
            <div id="codeGroup" class="code-group">
                <input type="text" id="codigoInput" placeholder="Código de 6 dígitos" maxlength="6">
                <button class="btn-login" onclick="verificarCodigo()">Verificar y acceder</button>
            </div>
        </div>
        <div class="divider"><span>o</span></div>
        <div style="text-align: center; font-size: 12px; color: #6c8daa;">¿Necesitas ayuda? Contacta con el administrador</div>
        <div id="loginError" class="error-msg"></div>
        <div id="loginSuccess" class="success-msg"></div>
    </div>
</div>

<div id="app">
    <div class="dashboard-header">
        <h2>Sistema de Cotizaciones</h2>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="vistaPrevia()">Vista Previa</button>
            <button class="btn btn-success" onclick="descargarPDF()">Descargar PDF</button>
            <button class="btn btn-warning" onclick="guardarCotizacion()">Guardar</button>
            <button class="btn btn-secondary" onclick="nuevaCotizacion()">Nueva Cotización</button>
            <button class="btn btn-info" onclick="limpiarTodoHistorial()">Limpiar Historial</button>
            <button class="btn btn-danger" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>
    <div class="workspace">
        <div class="quote-area">
            <div id="pagesContainer"></div>
            <div class="page-controls">
                <button class="btn btn-primary" onclick="agregarPaginaItems()">+ Agregar Página de Items</button>
            </div>
        </div>
        <div class="history-area">
            <h3>Historial de Cotizaciones</h3>
            <input type="text" id="searchHistory" class="history-search" placeholder="Buscar..." onkeyup="filtrarHistorial()">
            <div id="historial"></div>
            <button class="btn btn-secondary" style="width:100%; margin-top:10px;" onclick="exportarHistorial()">Exportar Historial</button>
        </div>
    </div>
</div>

<div id="preview">
    <button class="close-preview" onclick="cerrarPreview()">✖ Cerrar</button>
    <div id="previewContent" class="previewA4"></div>
</div>

<script>
    const USUARIO_RUC = "10617365036";
    const USUARIO_CELULAR = "993963381";
    const CONTRASENA = "yuri2026";
    let codigoEnviado = null;
    let cotizaciones = [];
    let itemsGlobal = [];

    // ============ FUNCIONES DE LOGIN ============
    function mostrarFormulario(tipo) {
        document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.querySelectorAll('.login-form').forEach(f => f.classList.remove('active'));
        document.getElementById(`form-${tipo}`).classList.add('active');
        document.getElementById('loginError').innerText = '';
        document.getElementById('loginSuccess').innerText = '';
    }

    function togglePassword(inputId, btn) {
        let passInput = document.getElementById(inputId);
        if (passInput.type === 'password') {
            passInput.type = 'text';
            btn.textContent = 'Ocultar';
        } else {
            passInput.type = 'password';
            btn.textContent = 'Mostrar';
        }
    }

    function loginRuc() {
        let ruc = document.getElementById('rucInput').value.trim();
        let pass = document.getElementById('passRuc').value.trim();
        if (ruc === USUARIO_RUC && pass === CONTRASENA) ingresarAlSistema();
        else document.getElementById('loginError').innerText = 'RUC o Contraseña incorrectos';
    }

    function loginCelular() {
        let celular = document.getElementById('celularInput').value.trim();
        let pass = document.getElementById('passCel').value.trim();
        if (celular === USUARIO_CELULAR && pass === CONTRASENA) ingresarAlSistema();
        else document.getElementById('loginError').innerText = 'Celular o Contraseña incorrectos';
    }

    function enviarCodigo() {
        let celular = document.getElementById('celularCodeInput').value.trim();
        if (celular !== USUARIO_CELULAR) {
            document.getElementById('loginError').innerText = 'Número no registrado';
            return;
        }
        codigoEnviado = '123456';
        document.getElementById('codeGroup').style.display = 'block';
        document.getElementById('loginSuccess').innerHTML = 'Código enviado: 123456 (simulado)';
        document.getElementById('codigoInput').value = '';
        setTimeout(() => document.getElementById('loginSuccess').innerHTML = '', 5000);
    }

    function verificarCodigo() {
        let codigo = document.getElementById('codigoInput').value.trim();
        if (codigo === codigoEnviado) ingresarAlSistema();
        else document.getElementById('loginError').innerText = 'Código incorrecto';
    }

    function ingresarAlSistema() {
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        cargarLogosGuardados();
        cargarFirmasGuardadas();
        nuevaCotizacion();
        cargarHistorial();
    }

    function cerrarSesion() {
        if (confirm('¿Cerrar sesión?')) {
            document.getElementById('login').style.display = 'flex';
            document.getElementById('app').style.display = 'none';
            codigoEnviado = null;
        }
    }

    // ============ FUNCIONES DE COTIZACIÓN ============
    function generarNumero() {
        let contador = parseInt(localStorage.getItem('contador')) || 0;
        contador++;
        localStorage.setItem('contador', contador);
        return String(contador).padStart(4, '0') + '-' + new Date().getFullYear();
    }

    function getFechaActual() {
        let hoy = new Date();
        return hoy.toISOString().split('T')[0];
    }

    function getFechaValidez() {
        let hoy = new Date();
        hoy.setDate(hoy.getDate() + 15);
        return hoy.toISOString().split('T')[0];
    }

    function getFechaImpresion() {
        let ahora = new Date();
        return ahora.toLocaleDateString('es-ES') + ' ' + ahora.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
    }

    // Crear una fila de item

    // Calcular totales globales
    function actualizarTotales() {
        let monedaSelect = document.getElementById('monedaPrincipal');
        let moneda = monedaSelect ? monedaSelect.value : 'PEN';
        let sim = moneda === 'PEN' ? 'S/ ' : '$ ';
        let incluirIGV = document.getElementById('igvGlobal')?.checked || true;
        
        let subtotalGlobal = 0;
        let pages = document.querySelectorAll('.a4-page');
        
        pages.forEach(page => {
            let subtotalPagina = 0;
            let rows = page.querySelectorAll('.items-table tbody tr');
            rows.forEach(row => {
                let cant = parseFloat(row.querySelector('td:nth-child(3) input').value) || 0;
                let precio = parseFloat(row.querySelector('td:nth-child(4) input').value) || 0;
                let sub = cant * precio;
                let subtotalCell = row.querySelector('.subtotal-cell');
                if (subtotalCell) subtotalCell.innerText = sub.toFixed(2);
                subtotalPagina += sub;
            });
            subtotalGlobal += subtotalPagina;
            
            let pageSubtotal = page.querySelector('.page-subtotal');
            let pageIgv = page.querySelector('.page-igv');
            let pageTotal = page.querySelector('.page-total');
            let pageIgvLine = page.querySelector('.page-igv-line');
            
            if (pageSubtotal) {
                let igvPagina = incluirIGV ? subtotalPagina * 0.18 : 0;
                let totalPagina = subtotalPagina + igvPagina;
                pageSubtotal.innerText = sim + subtotalPagina.toFixed(2);
                if (pageIgv) pageIgv.innerText = sim + igvPagina.toFixed(2);
                if (pageTotal) pageTotal.innerText = sim + totalPagina.toFixed(2);
                if (pageIgvLine) pageIgvLine.style.display = incluirIGV ? 'block' : 'none';
            }
        });
        
        let igvGlobal = incluirIGV ? subtotalGlobal * 0.18 : 0;
        let totalGlobal = subtotalGlobal + igvGlobal;
        let totalGeneralSpan = document.getElementById('totalGeneralSpan');
        if (totalGeneralSpan) totalGeneralSpan.innerText = sim + totalGlobal.toFixed(2);
    }

        let direccion = primeraPagina.querySelector('.dir-empresa')?.value;
        let clienteNom = primeraPagina.querySelector('.cliente-nombre')?.value;
        let clienteDoc = primeraPagina.querySelector('.cliente-doc')?.value;
        let clienteCel = primeraPagina.querySelector('.cliente-cel')?.value;
        let clienteDir = primeraPagina.querySelector('.cliente-dir')?.value;
        
        document.querySelectorAll('.a4-page').forEach(page => {
            let numInput = page.querySelector('.num-cot');
            let fechaInput = page.querySelector('.fecha-emision');
            let validezInput = page.querySelector('.fecha-validez');
            let monedaSelect = page.querySelector('.moneda-select');
            let dirInput = page.querySelector('.dir-empresa');
            
            if (numInput && numCot && !numInput.value) numInput.value = numCot;
            if (fechaInput && fechaEmision && !fechaInput.value) fechaInput.value = fechaEmision;
            if (validezInput && fechaValidez && !validezInput.value) validezInput.value = fechaValidez;
            if (monedaSelect && moneda && !monedaSelect.value) monedaSelect.value = moneda;
            if (dirInput && direccion && !dirInput.value) dirInput.value = direccion;
            
            if (page.querySelector('.cliente-nombre') && clienteNom) {
                page.querySelector('.cliente-nombre').value = clienteNom;
                page.querySelector('.cliente-doc').value = clienteDoc || '';
                page.querySelector('.cliente-cel').value = clienteCel || '';
                page.querySelector('.cliente-dir').value = clienteDir || '';

    // ============ FUNCIONES DE LOGOS Y FIRMAS ============
    function subirLogo(posicion) {
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function(e) {
            let file = e.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(event) {
                    document.querySelectorAll(`#${posicion}`).forEach(img => {
                        img.src = event.target.result;
                        img.style.display = 'block';
                    });
                    localStorage.setItem(posicion, event.target.result);
                };
                reader.readAsDataURL(file);
            }
        };
        input.click();
    }
    
    function cargarLogosGuardados() {
        let logo1 = localStorage.getItem('logo1');
        let logo2 = localStorage.getItem('logo2');
        document.querySelectorAll('#logo1, #logo1f').forEach(img => {
            if (logo1) { img.src = logo1; img.style.display = 'block'; }
        });
        document.querySelectorAll('#logo2, #logo2f').forEach(img => {
            if (logo2) { img.src = logo2; img.style.display = 'block'; }
        });
    }
    
    function cargarLogosEnPaginas() {
        cargarLogosGuardados();
    }
    
    function subirFirma() {
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function(e) {
            let file = e.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(event) {
                    document.querySelectorAll('.firma-img').forEach(img => {
                        img.src = event.target.result;
                        img.style.display = 'block';
                    });
                    localStorage.setItem('firmaFisica', event.target.result);
                    alert('Firma física subida');
                };
                reader.readAsDataURL(file);
            }
        };
        input.click();
    }
    
    function limpiarFirmaFisica() {
        if (confirm('¿Eliminar firma física?')) {
            document.querySelectorAll('.firma-img').forEach(img => {
                img.style.display = 'none';
                img.src = '';

            localStorage.removeItem('firmaFisica');

                <em>Ley N° 27269</em>

    function limpiarFirmaDigital() {
        if (confirm('¿Eliminar firma digital?')) {
            document.querySelectorAll('.firma-digital .signature-info').forEach(info => {
                info.innerHTML = '';

    function cargarFirmasGuardadas() {

    // ============ FUNCIONES DE PDF ============
    async function descargarPDF() {
        let cliente = document.querySelector('.cliente-nombre')?.value || 'Cliente';
        let numCot = document.querySelector('.num-cot')?.value || '0000';
        let container = document.getElementById('pagesContainer').cloneNode(true);
        
        // Preparar para PDF
        container.querySelectorAll('.logo-buttons, .add-item-btn, .delete-item, .signature-box button, .firma-fisica button, .firma-digital button').forEach(el => {
            if (el) el.style.display = 'none';
        });
        
        container.querySelectorAll('textarea, input').forEach(el => {
            if (el.tagName === 'TEXTAREA') {
                let div = document.createElement('div');
                div.style.whiteSpace = 'pre-wrap';
                div.style.fontSize = '8px';
                div.style.padding = '2px';
                div.innerText = el.value;
                el.parentNode.replaceChild(div, el);
            } else {
                el.style.border = 'none';
                el.style.background = 'transparent';
            }
        });
        
        container.classList.add('pdf');
        
        const opt = {
            margin: [0.3, 0.3, 0.3, 0.3],
            filename: `Cotizacion_${numCot}_${cliente.replace(/[^a-z0-9]/gi, '_')}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };
        
        await html2pdf().set(opt).from(container).save();
    }
    
    function vistaPrevia() {
        let container = document.getElementById('pagesContainer').cloneNode(true);
        container.querySelectorAll('.logo-buttons, .add-item-btn, .delete-item, .signature-box button, .firma-fisica button, .firma-digital button').forEach(el => {
            if (el) el.style.display = 'none';
        });
        document.getElementById('previewContent').innerHTML = '';
        document.getElementById('previewContent').appendChild(container);
        document.getElementById('preview').style.display = 'block';
    }
    
    function cerrarPreview() {
        document.getElementById('preview').style.display = 'none';
    }
    
    // ============ FUNCIONES DE HISTORIAL ============
    function guardarCotizacion() {
        let items = [];
        document.querySelectorAll('.items-table tbody tr').forEach(row => {
            items.push({
                desc: row.querySelector('textarea')?.value || '',
                cant: row.querySelector('td:nth-child(3) input')?.value || '0',
                precio: row.querySelector('td:nth-child(4) input')?.value || '0'
            });
        });
        
        let cotizacion = {
            id: Date.now(),
            numero: document.querySelector('.num-cot')?.value,
            fecha: document.querySelector('.fecha-emision')?.value,
            cliente: {
                nombre: document.querySelector('.cliente-nombre')?.value || '',
                documento: document.querySelector('.cliente-doc')?.value || '',
                celular: document.querySelector('.cliente-cel')?.value || '',
                direccion: document.querySelector('.cliente-dir')?.value || ''
            },
            items: items,
            totalFinal: document.getElementById('totalGeneralSpan')?.innerText || '0.00'
        };
        
        cotizaciones = cotizaciones.filter(c => c.id !== cotizacion.id);
        cotizaciones.unshift(cotizacion);
        if (cotizaciones.length > 100) cotizaciones = cotizaciones.slice(0, 100);
        localStorage.setItem('cotizaciones', JSON.stringify(cotizaciones));
        cargarHistorial();
        alert('Cotización guardada');
    }
    
    function cargarHistorial() {
        cotizaciones = JSON.parse(localStorage.getItem('cotizaciones') || '[]');
        filtrarHistorial();
    }
    
    function filtrarHistorial() {
        let searchTerm = document.getElementById('searchHistory')?.value.toLowerCase() || '';
        let filtered = cotizaciones.filter(cot =>
            cot.numero?.toLowerCase().includes(searchTerm) ||
            (cot.cliente?.nombre || '').toLowerCase().includes(searchTerm)
        );
        
        let div = document.getElementById('historial');
        div.innerHTML = '';
        
        if (filtered.length === 0) {
            div.innerHTML = '<p style="text-align:center; color:#888;">No hay cotizaciones</p>';
            return;
        }
        
        filtered.forEach(cot => {
            let item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div class="history-info" onclick='cargarCotizacion(${cot.id})'>
                    <strong>${cot.numero}</strong><br>
                    ${cot.cliente?.nombre || 'Anónimo'}<br>
                    <small>${cot.fecha} | ${cot.totalFinal}</small>
                </div>
                <div class="history-actions">
                    <button class="btn-edit" onclick='cargarCotizacion(${cot.id})'>✏️</button>
                    <button class="btn-delete" onclick='eliminarCotizacion(${cot.id}, event)'>🗑️</button>
                </div>
            `;
            div.appendChild(item);
        });
    }
    
    function eliminarCotizacion(id, event) {
        event.stopPropagation();
        if (confirm('¿Eliminar esta cotización?')) {
            cotizaciones = cotizaciones.filter(c => c.id !== id);
            localStorage.setItem('cotizaciones', JSON.stringify(cotizaciones));
            cargarHistorial();
            alert('Cotización eliminada');
        }
    }
    
    function limpiarTodoHistorial() {
        if (confirm('⚠️ ¿Eliminar TODAS las cotizaciones?')) {
            cotizaciones = [];
            localStorage.setItem('cotizaciones', JSON.stringify(cotizaciones));
            cargarHistorial();
            alert('Historial limpiado');
        }
    }
    
    function cargarCotizacion(id) {
        let cot = cotizaciones.find(c => c.id === id);
        if (!cot) return;
        
        if (confirm(`Cargar cotización ${cot.numero}?`)) {
            nuevaCotizacion();
            setTimeout(() => {
                document.querySelector('.num-cot').value = cot.numero;
                document.querySelector('.fecha-emision').value = cot.fecha;
                document.querySelector('.cliente-nombre').value = cot.cliente?.nombre || '';
                document.querySelector('.cliente-doc').value = cot.cliente?.documento || '';
                document.querySelector('.cliente-cel').value = cot.cliente?.celular || '';
                document.querySelector('.cliente-dir').value = cot.cliente?.direccion || '';
                
                let tbody = document.querySelector('.items-table tbody');
                if (tbody) {
                    tbody.innerHTML = '';
                    if (cot.items && cot.items.length) {
                        cot.items.forEach((item, idx) => {
                            let fila = crearFilaItem(idx + 1, item.desc, item.cant, item.precio);
                            tbody.appendChild(fila);
                        });
                    }
                }
                reorganizarPaginas();
                actualizarTotales();
            }, 200);
        }
    }
    
    function exportarHistorial() {
        if (cotizaciones.length === 0) { alert('No hay cotizaciones'); return; }
        let dataStr = JSON.stringify(cotizaciones, null, 2);
        let dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
        let link = document.createElement('a');
        link.setAttribute('href', dataUri);
        link.setAttribute('download', `cotizaciones_${new Date().toISOString().slice(0, 19)}.json`);
        link.click();
    }
