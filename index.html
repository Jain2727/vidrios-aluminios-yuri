<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vidrios y Aluminios Yuri | Cotizaciones</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial Narrow', Arial, sans-serif;
            background: #e0e5ec;
        }
        /* LOGIN */
        #login {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1f4e79, #0d2b45);
            padding: 20px;
        }
        .loginBox {
            background: white;
            padding: 35px;
            width: 400px;
            border-radius: 20px;
            text-align: center;
        }
        .loginBox h3 {
            color: #1f4e79;
            font-size: 24px;
        }
        .login-tabs {
            display: flex;
            gap: 5px;
            background: #eef2f7;
            border-radius: 50px;
            padding: 5px;
            margin: 20px 0;
        }
        .login-tab {
            flex: 1;
            padding: 8px;
            border: none;
            background: none;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Arial Narrow', sans-serif;
            font-weight: bold;
        }
        .login-tab.active {
            background: #1f4e79;
            color: white;
        }
        .login-form {
            display: none;
            text-align: left;
        }
        .login-form.active {
            display: block;
        }
        .login-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-family: 'Arial Narrow', sans-serif;
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 11px;
        }
        .btn-login {
            width: 100%;
            padding: 10px;
            background: #1f4e79;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .code-group { display: none; margin-top: 10px; }
        .error-msg { color: red; font-size: 12px; margin-top: 10px; }
        .success-msg { color: green; font-size: 12px; margin-top: 10px; }
        .divider {
            display: flex;
            align-items: center;
            margin: 15px 0;
            color: #aaa;
            font-size: 11px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }
        .divider span { padding: 0 10px; }
        /* APP */
        #app {
            display: none;
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
        }
        .dashboard-header {
            background: white;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Arial Narrow', sans-serif;
        }
        .btn-primary { background: #1f4e79; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: black; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-info { background: #17a2b8; color: white; }
        .workspace {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .quote-area { flex: 2.5; min-width: 320px; }
        .history-area {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 15px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .history-area h3 {
            color: #1f4e79;
            margin-bottom: 12px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 8px;
        }
        .history-search {
            width: 100%;
            padding: 6px 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .history-item {
            background: #f5f7fa;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 4px solid #1f4e79;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-actions button {
            padding: 3px 8px;
            margin-left: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        /* ============ PÁGINA A4 - DISEÑO ESTRICTAMENTE DENTRO ============ */
        .a4-page {
            background: white;
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto 20px auto;
            padding: 6mm 8mm;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            page-break-after: always;
            box-sizing: border-box;
            font-family: 'Arial Narrow', Arial, sans-serif;
            font-size: 10px;
            line-height: 1.2;
            overflow: hidden;
        }
        /* MARCA DE AGUA */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 38px;
            font-weight: bold;
            color: rgba(31, 78, 121, 0.07);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
        }
        .page-inner {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        /* ENCABEZADO - TABLA DE 3 COLUMNAS */
        .header-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 6px;
        }
        .header-table td {
            border: none;
            padding: 2px;
            vertical-align: middle;
        }
        .logo-cell {
            width: 60px;
            text-align: center;
        }
        .logo-img {
            max-width: 55px;
            max-height: 55px;
        }
        .title-cell {
            text-align: center;
        }
        .company-name {
            font-size: 18px;
            font-weight: 800;
            color: #1f4e79;
        }
        .company-owner {
            font-size: 10px;
            font-weight: bold;
            color: #2c5a7a;
        }
        .company-ruc {
            font-size: 8px;
            color: #5a6e7a;
        }
        .company-dir input {
            font-size: 8px;
            padding: 2px 5px;
            border: 1px solid #ccc;
            border-radius: 12px;
            width: 70%;
            text-align: center;
        }
        /* NÚMERO COTIZACIÓN */
        .quote-number {
            background: linear-gradient(135deg, #1f4e79, #0d3b5a);
            text-align: center;
            padding: 4px;
            border-radius: 6px;
            margin: 5px 0;
        }
        .quote-number label {
            color: white;
            font-size: 11px;
            font-weight: bold;
            margin-right: 8px;
        }
        .quote-number input {
            background: transparent;
            border: 1px solid white;
            color: white;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            width: 130px;
            text-align: center;
        }
        /* FECHAS - TABLA */
        .dates-table {
            width: 100%;
            text-align: right;
            margin: 5px 0;
        }
        .dates-table td {
            padding: 2px 4px;
            font-size: 9px;
        }
        .dates-table input, .dates-table select {
            font-size: 9px;
            padding: 2px 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        /* CLIENTE */
        .client-card {
            background: #e8f4fd;
            border: 1px solid #c0d8e8;
            border-radius: 6px;
            padding: 6px 10px;
            margin: 6px 0;
        }
        .client-card h4 {
            font-size: 10px;
            color: #1f4e79;
            margin-bottom: 5px;
            border-left: 3px solid #1f4e79;
            padding-left: 6px;
        }
        .client-row {
            display: flex;
            margin-bottom: 3px;
            gap: 5px;
        }
        .client-row label {
            width: 95px;
            font-weight: bold;
            font-size: 8px;
            color: #1f4e79;
        }
        .client-row input {
            flex: 1;
            font-size: 8px;
            padding: 2px 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        /* TABLA DE ITEMS - ANCHOS FIJOS EN PORCENTAJE */
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin: 6px 0;
            font-size: 8px;
            table-layout: fixed;
        }
        .items-table th {
            background: #1f4e79;
            color: white;
            padding: 4px 2px;
            border: 1px solid #2c5a7a;
        }
        .items-table td {
            border: 1px solid #ccc;
            padding: 3px 2px;
            vertical-align: top;
            word-wrap: break-word;
        }
        .items-table th:nth-child(1) { width: 6%; }
        .items-table th:nth-child(2) { width: 48%; }
        .items-table th:nth-child(3) { width: 10%; }
        .items-table th:nth-child(4) { width: 12%; }
        .items-table th:nth-child(5) { width: 12%; }
        .items-table th:nth-child(6) { width: 12%; }
        .items-table textarea {
            width: 100%;
            border: none;
            font-size: 8px;
            font-family: 'Arial Narrow', Arial, sans-serif;
            resize: vertical;
            min-height: 35px;
            background: transparent;
        }
        .items-table input {
            width: 100%;
            border: none;
            font-size: 8px;
            text-align: center;
            background: transparent;
        }
        .delete-item {
            background: #dc3545;
            color: white;
            border: none;
            padding: 2px 5px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 7px;
        }
        .add-item-btn {
            margin: 4px 0;
            padding: 2px 8px;
            font-size: 9px;
        }
        /* TOTALES PÁGINA */
        .page-totals {
            text-align: right;
            padding: 4px 8px;
            background: #f8fafc;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 5px 0;
        }
        .page-totals p {
            margin: 2px 0;
            font-size: 9px;
        }
        .igv-toggle {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 5px;
            margin-bottom: 3px;
        }
        /* TOTAL GENERAL - SOLO ULTIMA PÁGINA */
        .total-general {
            background: #1f4e79;
            color: white;
            text-align: right;
            padding: 5px 12px;
            border-radius: 5px;
            margin: 8px 0;
        }
        .total-general p {
            font-size: 13px;
            font-weight: bold;
        }
        /* FIRMA Y PAGO - MISMA LÍNEA */
        .signature-payment {
            display: flex;
            gap: 15px;
            margin: 10px 0;
        }
        .payment-box {
            flex: 1;
            background: #f0f7ff;
            border: 1px solid #c0d8e8;
            border-radius: 6px;
            padding: 6px;
        }
        .payment-box h5 {
            font-size: 9px;
            color: #1f4e79;
            border-bottom: 1px solid #ccc;
            padding-bottom: 3px;
            margin-bottom: 4px;
        }
        .payment-box p {
            font-size: 7px;
            margin: 2px 0;
        }
        .signature-box {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 6px;
            text-align: center;
        }
        .signature-box h5 {
            font-size: 9px;
            color: #1f4e79;
            margin-bottom: 5px;
        }
        .firma-img {
            max-width: 120px;
            max-height: 45px;
        }
        .signature-box button {
            background: #1f4e79;
            color: white;
            border: none;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 7px;
            cursor: pointer;
            margin: 2px;
        }
        .signature-info {
            font-size: 6px;
            color: #666;
            margin-top: 4px;
        }
        /* PIE DE PÁGINA - SIEMPRE AL FINAL */
        .footer {
            margin-top: auto;
            padding-top: 5px;
            border-top: 1px solid #ccc;
            font-size: 7px;
            color: #888;
        }
        .footer-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        .footer-center {
            text-align: center;
        }
        .page-controls {
            text-align: center;
            margin: 20px 0;
        }
        #preview {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            overflow: auto;
            padding: 30px;
        }
        .previewA4 { background: white; width: 210mm; margin: 0 auto; }
        .close-preview {
            position: fixed;
            top: 20px;
            right: 30px;
            background: white;
            border: none;
            font-size: 20px;
            border-radius: 50%;
            padding: 8px 18px;
            cursor: pointer;
            z-index: 1001;
        }
        /* PDF STYLES */
        .pdf .add-item-btn, .pdf .delete-item,
        .pdf .signature-box button, .pdf .firma-fisica button, .pdf .firma-digital button,
        .pdf .logo-buttons {
            display: none !important;
        }
        .pdf textarea, .pdf input {
            border: none !important;
            background: transparent !important;
        }
        @media (max-width: 800px) {
            .a4-page { width: 100%; }
        }
    </style>
</head>
<body>

<div id="login">
    <div class="loginBox">
        <h3>VIDRIOS Y ALUMINIOS YURI</h3>
        <div class="login-tabs">
            <button class="login-tab active" onclick="mostrarFormulario('ruc')">RUC</button>
            <button class="login-tab" onclick="mostrarFormulario('celular')">Celular</button>
            <button class="login-tab" onclick="mostrarFormulario('codigo')">Código SMS</button>
        </div>
        <div id="form-ruc" class="login-form active">
            <input type="text" id="rucInput" placeholder="RUC / Usuario">
            <div class="password-wrapper">
                <input type="password" id="passRuc" placeholder="Contraseña">
                <button type="button" class="toggle-password" onclick="togglePassword('passRuc', this)">Mostrar</button>
            </div>
            <button class="btn-login" onclick="loginRuc()">Ingresar con RUC</button>
        </div>
        <div id="form-celular" class="login-form">
            <input type="tel" id="celularInput" placeholder="Número de celular">
            <div class="password-wrapper">
                <input type="password" id="passCel" placeholder="Contraseña">
                <button type="button" class="toggle-password" onclick="togglePassword('passCel', this)">Mostrar</button>
            </div>
            <button class="btn-login" onclick="loginCelular()">Ingresar con Celular</button>
        </div>
        <div id="form-codigo" class="login-form">
            <input type="tel" id="celularCodeInput" placeholder="Número de celular">
            <button class="btn-login btn-verify" onclick="enviarCodigo()">Enviar código SMS</button>
            <div id="codeGroup" class="code-group">
                <input type="text" id="codigoInput" placeholder="Código de 6 dígitos" maxlength="6">
                <button class="btn-login" onclick="verificarCodigo()">Verificar y acceder</button>
            </div>
        </div>
        <div class="divider"><span>o</span></div>
        <div id="loginError" class="error-msg"></div>
        <div id="loginSuccess" class="success-msg"></div>
    </div>
</div>

<div id="app">
    <div class="dashboard-header">
        <h2>Sistema de Cotizaciones</h2>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="vistaPrevia()">Vista Previa</button>
            <button class="btn btn-success" onclick="descargarPDF()">Descargar PDF</button>
            <button class="btn btn-warning" onclick="guardarCotizacion()">Guardar</button>
            <button class="btn btn-secondary" onclick="nuevaCotizacion()">Nueva Cotización</button>
            <button class="btn btn-info" onclick="limpiarTodoHistorial()">Limpiar Historial</button>
            <button class="btn btn-danger" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>
    <div class="workspace">
        <div class="quote-area">
            <div id="pagesContainer"></div>
            <div style="text-align:center; margin:20px 0;">
                <button class="btn btn-primary" onclick="agregarPaginaItems()">+ Agregar Página de Items</button>
            </div>
        </div>
        <div class="history-area">
            <h3>Historial</h3>
            <input type="text" id="searchHistory" class="history-search" placeholder="Buscar..." onkeyup="filtrarHistorial()">
            <div id="historial"></div>
            <button class="btn btn-secondary" style="width:100%; margin-top:10px;" onclick="exportarHistorial()">Exportar</button>
        </div>
    </div>
</div>

<div id="preview">
    <button class="close-preview" onclick="cerrarPreview()">✖ Cerrar</button>
    <div id="previewContent" class="previewA4"></div>
</div>

<script>
    const USUARIO_RUC = "10617365036";
    const USUARIO_CELULAR = "993963381";
    const CONTRASENA = "yuri2026";
    let codigoEnviado = null;
    let cotizaciones = [];

    // LOGIN
    function mostrarFormulario(tipo) {
        document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.querySelectorAll('.login-form').forEach(f => f.classList.remove('active'));
        document.getElementById(`form-${tipo}`).classList.add('active');
        document.getElementById('loginError').innerText = '';
    }
    function togglePassword(inputId, btn) {
        let inp = document.getElementById(inputId);
        if (inp.type === 'password') { inp.type = 'text'; btn.textContent = 'Ocultar'; }
        else { inp.type = 'password'; btn.textContent = 'Mostrar'; }
    }
    function loginRuc() {
        let ruc = document.getElementById('rucInput').value.trim();
        let pass = document.getElementById('passRuc').value.trim();
        if (ruc === USUARIO_RUC && pass === CONTRASENA) ingresarAlSistema();
        else document.getElementById('loginError').innerText = 'RUC o Contraseña incorrectos';
    }
    function loginCelular() {
        let cel = document.getElementById('celularInput').value.trim();
        let pass = document.getElementById('passCel').value.trim();
        if (cel === USUARIO_CELULAR && pass === CONTRASENA) ingresarAlSistema();
        else document.getElementById('loginError').innerText = 'Celular o Contraseña incorrectos';
    }
    function enviarCodigo() {
        let cel = document.getElementById('celularCodeInput').value.trim();
        if (cel !== USUARIO_CELULAR) { document.getElementById('loginError').innerText = 'Número no registrado'; return; }
        codigoEnviado = '123456';
        document.getElementById('codeGroup').style.display = 'block';
        document.getElementById('loginSuccess').innerHTML = 'Código: 123456';
        setTimeout(() => document.getElementById('loginSuccess').innerHTML = '', 4000);
    }
    function verificarCodigo() {
        if (document.getElementById('codigoInput').value.trim() === codigoEnviado) ingresarAlSistema();
        else document.getElementById('loginError').innerText = 'Código incorrecto';
    }
    function ingresarAlSistema() {
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        cargarLogosGuardados();
        cargarFirmasGuardadas();
        nuevaCotizacion();
        cargarHistorial();
    }
    function cerrarSesion() {
        if (confirm('¿Cerrar sesión?')) {
            document.getElementById('login').style.display = 'flex';
            document.getElementById('app').style.display = 'none';
        }
    }

    // UTILIDADES
    function generarNumero() {
        let c = parseInt(localStorage.getItem('contador')) || 0;
        c++;
        localStorage.setItem('contador', c);
        return String(c).padStart(4, '0') + '-' + new Date().getFullYear();
    }
    function getFechaActual() { return new Date().toISOString().split('T')[0]; }
    function getFechaValidez() { let d = new Date(); d.setDate(d.getDate() + 15); return d.toISOString().split('T')[0]; }
    function getFechaImpresion() {
        let d = new Date();
        return d.toLocaleDateString('es-ES') + ' ' + d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
    }

    // CREAR FILA DE ITEM
    function crearFilaItem(num, desc = '', cant = '1', precio = '0') {
        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="text-align:center">${num}</td>
            <td><textarea rows="2" placeholder="Descripción..." onchange="recalcularTotales()">${desc.replace(/</g, '&lt;')}</textarea></td>
            <td><input type="number" value="${cant}" min="0" step="1" onchange="recalcularTotales()"></td>
            <td><input type="number" value="${precio}" min="0" step="0.01" onchange="recalcularTotales()"></td>
            <td class="subtotal-cell" style="text-align:right">0.00</td>
            <td style="text-align:center"><button class="delete-item" onclick="eliminarItem(this)">X</button></td>
        `;
        return tr;
    }

    function eliminarItem(btn) {
        if (confirm('¿Eliminar item?')) {
            btn.closest('tr').remove();
            reordenarItemsPagina(btn.closest('.a4-page'));
            recalcularTotales();
            reorganizarTodo();
        }
    }

    function reordenarItemsPagina(page) {
        let rows = page.querySelectorAll('.items-table tbody tr');
        rows.forEach((row, i) => row.cells[0].innerText = i + 1);
    }

    function recalcularTotales() {
        let pages = document.querySelectorAll('.a4-page');
        let monedaSel = document.querySelector('.moneda-select');
        let moneda = monedaSel ? monedaSel.value : 'PEN';
        let sim = moneda === 'PEN' ? 'S/ ' : '$ ';
        let igvGlobalCheck = document.querySelector('.igv-check-global');
        let incluirIGV = igvGlobalCheck ? igvGlobalCheck.checked : true;
        let totalGlobal = 0;

        pages.forEach(page => {
            let subtotal = 0;
            let rows = page.querySelectorAll('.items-table tbody tr');
            rows.forEach(row => {
                let cant = parseFloat(row.querySelector('td:nth-child(3) input').value) || 0;
                let precio = parseFloat(row.querySelector('td:nth-child(4) input').value) || 0;
                let sub = cant * precio;
                let subCell = row.querySelector('.subtotal-cell');
                if (subCell) subCell.innerText = sub.toFixed(2);
                subtotal += sub;
            });
            totalGlobal += subtotal;
            let igvPag = incluirIGV ? subtotal * 0.18 : 0;
            let totalPag = subtotal + igvPag;
            let pageSub = page.querySelector('.page-subtotal');
            let pageIgv = page.querySelector('.page-igv');
            let pageTot = page.querySelector('.page-total');
            let pageIgvLine = page.querySelector('.page-igv-line');
            if (pageSub) pageSub.innerText = sim + subtotal.toFixed(2);
            if (pageIgv) pageIgv.innerText = sim + igvPag.toFixed(2);
            if (pageTot) pageTot.innerText = sim + totalPag.toFixed(2);
            if (pageIgvLine) pageIgvLine.style.display = incluirIGV ? 'block' : 'none';
        });
        let igvGlobal = incluirIGV ? totalGlobal * 0.18 : 0;
        let totalFin = totalGlobal + igvGlobal;
        let totalSpan = document.getElementById('totalGeneralSpan');
        if (totalSpan) totalSpan.innerText = sim + totalFin.toFixed(2);
    }

    // REORGANIZACIÓN PRINCIPAL - MÁXIMO 10 ITEMS POR PÁGINA
    function reorganizarTodo() {
        let container = document.getElementById('pagesContainer');
        let todasPages = document.querySelectorAll('.a4-page');
        let paginaFinal = null;
        let paginasItems = [];
        todasPages.forEach(p => {
            if (p.querySelector('.signature-payment')) paginaFinal = p;
            else paginasItems.push(p);
        });
        let todosItems = [];
        paginasItems.forEach(p => {
            let rows = p.querySelectorAll('.items-table tbody tr');
            rows.forEach(r => {
                todosItems.push({
                    desc: r.querySelector('textarea').value,
                    cant: r.querySelector('td:nth-child(3) input').value,
                    precio: r.querySelector('td:nth-child(4) input').value
                });
            });
        });
        let itemsPorPag = 10;
        let numPagItems = Math.ceil(todosItems.length / itemsPorPag);
        if (numPagItems === 0) numPagItems = 1;
        let datosBase = obtenerDatosBase();
        container.innerHTML = '';
        for (let i = 0; i < numPagItems; i++) {
            let inicio = i * itemsPorPag;
            let itemsPag = todosItems.slice(inicio, inicio + itemsPorPag);
            let esPrimera = (i === 0);
            let page = crearPaginaBase(esPrimera, datosBase, i + 1, numPagItems + (paginaFinal ? 1 : 0));
            let tbody = page.querySelector('.items-table tbody');
            itemsPag.forEach((item, idx) => {
                let fila = crearFilaItem(idx + 1, item.desc, item.cant, item.precio);
                tbody.appendChild(fila);
            });
            if (itemsPag.length === 0 && i === 0) {
                let fila = crearFilaItem(1, '', '1', '0');
                tbody.appendChild(fila);
            }
            container.appendChild(page);
        }
        if (paginaFinal) {
            let newFinal = crearPaginaFinal(datosBase, numPagItems + 1, numPagItems + 1);
            container.appendChild(newFinal);
        } else {
            let newFinal = crearPaginaFinal(datosBase, numPagItems + 1, numPagItems + 1);
            container.appendChild(newFinal);
        }
        actualizarNumerosPagina();
        cargarLogosEnPaginas();
        cargarFirmasEnPaginas();
        recalcularTotales();
    }

    function obtenerDatosBase() {

            validez: primera?.querySelector('.fecha-validez')?.value || getFechaValidez(),

            clienteCel: primera?.querySelector('.cliente-cel')?.value || '',
            clienteDir: primera?.querySelector('.cliente-dir')?.value || ''

    }

    function agregarItemAPagina(btn) {
        let page = btn.closest('.a4-page');
        let tbody = page.querySelector('.items-table tbody');
        let num = tbody.rows.length + 1;
        let fila = crearFilaItem(num, '', '1', '0');
        tbody.appendChild(fila);
        recalcularTotales();
        reorganizarTodo();
    }

    function agregarPaginaItems() {
        let datos = obtenerDatosBase();
        let container = document.getElementById('pagesContainer');
        let paginaFinal = document.querySelector('.a4-page:has(.signature-payment)');
        let paginasItems = document.querySelectorAll('.a4-page:not(:has(.signature-payment))');
        let nuevaPag = crearPaginaBase(false, datos, paginasItems.length + 1, paginasItems.length + 2);
        if (paginaFinal) paginaFinal.remove();
        container.appendChild(nuevaPag);
        let newFinal = crearPaginaFinal(datos, paginasItems.length + 2, paginasItems.length + 2);
        container.appendChild(newFinal);
        actualizarNumerosPagina();
        cargarLogosEnPaginas();
        cargarFirmasEnPaginas();
        recalcularTotales();
    }

    function actualizarNumerosPagina() {
        let pages = document.querySelectorAll('.a4-page');
        pages.forEach((p, i) => {
            let pn = p.querySelector('.page-num');
            let tp = p.querySelector('.total-pages');
            if (pn) pn.innerText = i + 1;
            if (tp) tp.innerText = pages.length;
        });
    }

    function nuevaCotizacion() {
        if (confirm('¿Nueva cotización?')) {
            document.getElementById('pagesContainer').innerHTML = '';

                numero: generarNumero(),
                fecha: getFechaActual(),
                validez: getFechaValidez(),
                moneda: 'PEN',
                direccion: 'APV LAS JOYAS SAN SEBASTIAN CUSCO',
                clienteNombre: '', clienteDoc: '', clienteCel: '', clienteDir: ''
            };
            let primera = crearPaginaBase(true, datos, 1, 2);
            let tbody = primera.querySelector('.items-table tbody');
            tbody.appendChild(crearFilaItem(1, '', '1', '0'));
            let final = crearPaginaFinal(datos, 2, 2);
            document.getElementById('pagesContainer').appendChild(primera);
            document.getElementById('pagesContainer').appendChild(final);
            actualizarNumerosPagina();
            cargarLogosEnPaginas();
            cargarFirmasEnPaginas();
            recalcularTotales();
        }
    }

    // LOGOS Y FIRMAS
    function subirLogo(pos) {
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = e => {
            let file = e.target.files[0];
            if (file) {
                let r = new FileReader();
                r.onload = ev => {
                    document.querySelectorAll(`.${pos}`).forEach(img => { img.src = ev.target.result; img.style.display = 'block'; });
                    localStorage.setItem(pos, ev.target.result);
                };
                r.readAsDataURL(file);
            }
        };
        input.click();
    }
    function cargarLogosGuardados() {
        let l1 = localStorage.getItem('logo1');
        let l2 = localStorage.getItem('logo2');
        document.querySelectorAll('.logo1').forEach(i => { if (l1) { i.src = l1; i.style.display = 'block'; } });
        document.querySelectorAll('.logo2').forEach(i => { if (l2) { i.src = l2; i.style.display = 'block'; } });
    }
    function cargarLogosEnPaginas() { cargarLogosGuardados(); }
    function subirFirma() {
        let inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.onchange = e => {
            let f = e.target.files[0];
            if (f) {
                let r = new FileReader();
                r.onload = ev => {
                    document.querySelectorAll('.firma-img').forEach(i => { i.src = ev.target.result; i.style.display = 'block'; });
                    localStorage.setItem('firmaFisica', ev.target.result);
                };
                r.readAsDataURL(f);
            }
        };
        inp.click();
    }
    function limpiarFirmaFisica() {
        if (confirm('¿Eliminar?')) {
            document.querySelectorAll('.firma-img').forEach(i => { i.style.display = 'none'; i.src = ''; });
            localStorage.removeItem('firmaFisica');
        }
    }
    function generarFirmaDigital() {
        let d = new Date();
        let html = `<div style="font-size:6px; text-align:left; margin-top:4px; padding:3px; border-top:1px solid #ccc;"><strong>FIRMA DIGITAL</strong><br>YURI HERMOZA PUELLES<br>DNI: 61736503<br>Fecha: ${d.toLocaleDateString('es-ES')} ${d.toLocaleTimeString('es-ES')}<br><em>Ley N° 27269</em></div>`;
        localStorage.setItem('firmaDigitalHTML', html);
        document.querySelectorAll('.firma-digital .signature-info').forEach(i => i.innerHTML = html);
    }
    function limpiarFirmaDigital() {
        document.querySelectorAll('.firma-digital .signature-info').forEach(i => i.innerHTML = '');
        localStorage.removeItem('firmaDigitalHTML');
    }
    function cargarFirmasGuardadas() {
        let f = localStorage.getItem('firmaFisica');
        let fd = localStorage.getItem('firmaDigitalHTML');
        if (f) document.querySelectorAll('.firma-img').forEach(i => { i.src = f; i.style.display = 'block'; });
        if (fd) document.querySelectorAll('.firma-digital .signature-info').forEach(i => i.innerHTML = fd);
    }
    function cargarFirmasEnPaginas() { cargarFirmasGuardadas(); }

    // PDF Y VISTA PREVIA
    async function descargarPDF() {
        let cli = document.querySelector('.cliente-nombre')?.value || 'Cliente';
        let num = document.querySelector('.num-cot')?.value || '0000';
        let cont = document.getElementById('pagesContainer').cloneNode(true);
        cont.querySelectorAll('.add-item-btn, .delete-item, .signature-box button, .firma-fisica button, .firma-digital button').forEach(b => b.remove());
        cont.querySelectorAll('textarea').forEach(ta => { let d = document.createElement('div'); d.style.whiteSpace = 'pre-wrap'; d.style.fontSize = '8px'; d.style.padding = '2px'; d.innerText = ta.value; ta.parentNode.replaceChild(d, ta); });
        cont.querySelectorAll('input').forEach(i => { if (i.type !== 'checkbox') i.style.border = 'none'; });
        const opt = { margin: [0.3, 0.3, 0.3, 0.3], filename: `Cotizacion_${num}_${cli.replace(/[^a-z0-9]/gi, '_')}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } };
        await html2pdf().set(opt).from(cont).save();
    }
    function vistaPrevia() {
        let cont = document.getElementById('pagesContainer').cloneNode(true);
        cont.querySelectorAll('.add-item-btn, .delete-item, .signature-box button, .firma-fisica button, .firma-digital button').forEach(b => b.remove());
        document.getElementById('previewContent').innerHTML = '';
        document.getElementById('previewContent').appendChild(cont);
        document.getElementById('preview').style.display = 'block';
    }
    function cerrarPreview() { document.getElementById('preview').style.display = 'none'; }

    // HISTORIAL
    function guardarCotizacion() {
        let items = [];
        document.querySelectorAll('.items-table tbody tr').forEach(r => {
            items.push({ desc: r.querySelector('textarea')?.value || '', cant: r.querySelector('td:nth-child(3) input')?.value || '0', precio: r.querySelector('td:nth-child(4) input')?.value || '0' });
        });
        let c = { id: Date.now(), numero: document.querySelector('.num-cot')?.value, fecha: document.querySelector('.fecha-emision')?.value, cliente: { nombre: document.querySelector('.cliente-nombre')?.value || '', documento: document.querySelector('.cliente-doc')?.value || '', celular: document.querySelector('.cliente-cel')?.value || '', direccion: document.querySelector('.cliente-dir')?.value || '' }, items: items, totalFinal: document.getElementById('totalGeneralSpan')?.innerText || '0.00' };
        cotizaciones = cotizaciones.filter(cot => cot.id !== c.id);
        cotizaciones.unshift(c);
        if (cotizaciones.length > 100) cotizaciones = cotizaciones.slice(0, 100);
        localStorage.setItem('cotizaciones', JSON.stringify(cotizaciones));
        cargarHistorial();
        alert('Guardado');
    }
    function cargarHistorial() {
        cotizaciones = JSON.parse(localStorage.getItem('cotizaciones') || '[]');
        filtrarHistorial();
    }
    function filtrarHistorial() {
        let term = document.getElementById('searchHistory')?.value.toLowerCase() || '';
        let filt = cotizaciones.filter(c => c.numero?.toLowerCase().includes(term) || (c.cliente?.nombre || '').toLowerCase().includes(term));
        let div = document.getElementById('historial');
        div.innerHTML = '';
        if (filt.length === 0) { div.innerHTML = '<p style="text-align:center; color:#888;">No hay cotizaciones</p>'; return; }
        filt.forEach(c => {
            let it = document.createElement('div');
            it.className = 'history-item';
            it.innerHTML = `<div class="history-info" onclick='cargarCotizacion(${c.id})'><strong>${c.numero}</strong><br>${c.cliente?.nombre || 'Anónimo'}<br><small>${c.fecha} | ${c.totalFinal}</small></div><div class="history-actions"><button class="btn-edit" onclick='cargarCotizacion(${c.id})'>✏️</button><button class="btn-delete" onclick='eliminarCotizacion(${c.id}, event)'>🗑️</button></div>`;
            div.appendChild(it);
        });
    }
    function eliminarCotizacion(id, ev) {
        ev.stopPropagation();
        if (confirm('¿Eliminar?')) { cotizaciones = cotizaciones.filter(c => c.id !== id); localStorage.setItem('cotizaciones', JSON.stringify(cotizaciones)); cargarHistorial(); alert('Eliminada'); }
    }
    function limpiarTodoHistorial() {
        if (confirm('¿Eliminar TODO?')) { cotizaciones = []; localStorage.setItem('cotizaciones', JSON.stringify(cotizaciones)); cargarHistorial(); alert('Historial limpiado'); }
    }
    function cargarCotizacion(id) {
        let cot = cotizaciones.find(c => c.id === id);
        if (!cot) return;
        if (confirm(`Cargar ${cot.numero}?`)) {
            nuevaCotizacion();
            setTimeout(() => {
                document.querySelector('.num-cot').value = cot.numero;
                document.querySelector('.fecha-emision').value = cot.fecha;
                document.querySelector('.cliente-nombre').value = cot.cliente?.nombre || '';
                document.querySelector('.cliente-doc').value = cot.cliente?.documento || '';
                document.querySelector('.cliente-cel').value = cot.cliente?.celular || '';
                document.querySelector('.cliente-dir').value = cot.cliente?.direccion || '';
                let tbody = document.querySelector('.items-table tbody');
                if (tbody) {
                    tbody.innerHTML = '';
                    cot.items.forEach((it, idx) => { tbody.appendChild(crearFilaItem(idx + 1, it.desc, it.cant, it.precio)); });
                }
                reorganizarTodo();
            }, 200);
        }
    }
    function exportarHistorial() {
        if (cotizaciones.length === 0) { alert('No hay'); return; }
        let link = document.createElement('a');
        link.href = 'data:application/json,' + encodeURIComponent(JSON.stringify(cotizaciones, null, 2));
        link.download = `cotizaciones_${new Date().toISOString().slice(0, 19)}.json`;
        link.click();
    }
